jobs.JobId:
  type: string
  example: 7af020f6-2e38-4d70-8cf0-4349650ea08c

jobs.JobStatus:
  type: string
  enum:
    - submitted
    - ready
    - running
    - succeeded
    - failed
    - cancelled
  example: submitted

jobs.JobType:
  type: string
  enum:
    - sampling
    - estimation
    - multi_manual
    - sse

jobs.Job:
  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
      nullable: false
    name:
      type: string
      example: Bell State Sampling
      nullable: true
    description:
      type: string
      example: Bell State Sampling Example
      nullable: false
    job_type:
      $ref: "#/jobs.JobType"
      nullable: false
    device_id:
      type: string
      example: Kawasaki
      nullable: false
    shots:
      type: integer
      minimum: 1
      maximum: 1e7
      example: 1000
      nullable: false
    input:
      $ref: "#/jobs.JobInfoDownloadPresignedURL"
      nullable: false
    transpiler_info:
      type: object
      nullable: true
      properties: {}
      additionalProperties: true
      example: {
        qubit_allocation: {
          "0": 12,
          "1": 16
        },
        skip_transpilation: false,
        seed_transpilation: 873
      }
    simulator_info:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
      example: {
        "n_qubits": 5,
        "n_nodes": 12,
        "n_per_node": 2,
        "seed_simulation": 39058567,
        "simulation_opt": {
          "optimization_method": "light",
          "optimization_block_size": 1,
          "optimization_swap_level": 1
        }
      }
    mitigation_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "ro_error_mitigation": "pseudo_inverse"
      }
      nullable: true
    status:
      $ref: "#/jobs.JobStatus"
      nullable: false
    execution_time:
      type: number
      example: 10.123
      nullable: true
      default: null
    submitted_at:
      type: string
      format: date-time
      nullable: true
      default: null
      example: 2022-10-19T11:45:34Z
    ready_at:
      type: string
      format: date-time
      nullable: true
      default: null
      example: 2022-10-19T11:45:34Z
    running_at:
      type: string
      format: date-time
      nullable: true
      default: null
      example: 2022-10-19T11:45:34Z
    ended_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34Z
      nullable: true
      default: null
  required:
    []
  example:
      job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
      name: Bell State Sampling
      description: Bell State Sampling Example
      device_id: Kawasaki
      job_type: sampling
      input: https://oqtopus-cloud.s3.amazonaws.com/jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/input.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D
      transpiler_info: {
        qubit_allocation: {
          "0": 12,
          "1": 16
        },
        skip_transpilation: false,
        seed_transpilation: 873
      }
      simulator_info: {
        "n_qubits": 5,
        "n_nodes": 12,
        "n_per_node": 2,
        "seed_simulation": 39058567,
        "simulation_opt": {
          "optimization_method": "light",
          "optimization_block_size": 1,
          "optimization_swap_level": 1
        }
      }
      mitigation_info: {
        "ro_error_mitigation": "pseudo_inverse"
      }
      shots: 1000
      status: submitted
      execution_time: 10.123
      submitted_at: 2022-10-19T11:45:34Z
      ready_at: 2022-10-19T11:45:34Z
      running_at: 2022-10-19T11:45:34Z
      ended_at: 2022-10-19T11:45:34Z

jobs.JobDef:
  allOf:
    - $ref: '#/jobs.Job'
  required:
    - job_id
    - device_id
    - job_type
    - input
    - shots
    - status

jobs.JobStatusUpdate:
  type: object
  properties:
    status:
      type: string
      enum:
        - running
        - succeeded
        - failed
        - cancelled
      example: succeeded
      nullable: false
    output_files:
      description: |-
        List of all S3 file keys uploaded by provider during job execution.
      type: array
      items:
        type: string
      nullable: true
      example: [
        7af020f6-2e38-4d70-8cf0-4349650ea08c/combined_program.zip,
        7af020f6-2e38-4d70-8cf0-4349650ea08c/transpile_result.zip,
        7af020f6-2e38-4d70-8cf0-4349650ea08c/result.zip
      ]
    message:
      type: string
      nullable: true
      example: Execution successful
    execution_time:
      type: number
      description: >-
        Execution time for quantum computation. Specify the time in seconds,
        including up to milliseconds.
      nullable: true
      example: 1256.58
  required:
    - status

jobs.JobStatusUpdateResponse:
  type: object
  properties:
    message:
      type: string
      nullable: false
  required:
    - message

jobs.UpdateJobTranspilerInfoRequest:
  type: object
  properties: {}
  additionalProperties: true

jobs.UpdateJobTranspilerInfoResponse:
  type: object
  properties:
    message:
      type: string
      nullable: false
  required:
    - message

jobs.JobInfoUploadPresignedURL:
  description: |-
    Presigned URL for uploading file to OCTOPUS cloud.
  type: object
  properties:
    url:
      type: string
      example: https://oqtopus-cloud.s3.amazonaws.com/
    fields:
      type: object
      properties:
        key:
          type: string
          example: jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/filename.zip
        AWSAccessKeyId:
          type: string
        x-amz-security-token:
          type: string
        policy:
          type: string
        signature:
          type: string

jobs.JobInfoDownloadPresignedURL:
  description: |-
    Presigned URL for downloading a file from OCTOPUS cloud.
  type: string
  nullable: false
  example: https://oqtopus-cloud.s3.amazonaws.com/jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/filename.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D

jobs.S3OperatorItem:
  type: object
  properties:
    pauli:
      type: string
      description: The Pauli string.
      nullable: false
      example: "X 0 X 1"
    coeff:
      description: "Coefficient number in the Pauli string representation."
      type: number
  required:
    - pauli

jobs.S3SubmitJobInfo:
  type: object
  properties:
    program:
      type: array
      description: >-
        A list of OPENQASM3 program.
        For non-multiprogramming jobs, this field is assumed to contain exactly one program.
        Otherwise, those programs are combined according to the multiprogramming machinery.
      items:
        type: string
      example: [
          "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;"
        ]
    operator:
      type: array
      items:
        $ref: "#/jobs.S3OperatorItem"
  required:
    - program

jobs.S3SamplingResult:
  type: object
  nullable: true
  description: "*(Only for sampling jobs)* JSON string representing the sampling result"
  properties:
    counts:
      type: object
      nullable: false
      properties: {}
      additionalProperties: true
      example: {
        "10": 84,
        "11": 387,
        "00": 454,
        "01": 75
      }
    divided_counts:
      type: object
      nullable: true
      properties: {}
      additionalProperties: true
      example: {
        "0": {
          "00": 84,
          "11": 387,
          "10": 454,
          "01": 75
        },
        "1": {
          "00": 84,
          "11": 387,
          "10": 454,
          "01": 75
        }
      }
  required:
    - counts

jobs.S3EstimationResult:
  type: object
  nullable: true
  description: |
      *(Only for estimation jobs)* The estimated expectation value and the standard deviation
      of the operators specified in `job_info.operator` field which is intended to be provided for estimation jobs.
  properties:
    exp_value:
      description: "The estimated expection value."
      nullable: false
      type: number
    stds:
      description: "The standard deviation value"
      nullable: false
      type: number
  required:
    - exp_value
    - stds

jobs.S3JobResult:
  type: object
  nullable: true
  properties:
    sampling:
      $ref: "#/jobs.S3SamplingResult"
    estimation:
      $ref: "#/jobs.S3EstimationResult"
  additionalProperties: true
  required: []

jobs.S3TranspileResult:
  type: object
  nullable: true
  properties:
    transpiled_program:
      type: string
      nullable: true
      example: >-
        OPENQASM 3;
        include "stdgates.inc";
        qubit[2] _all_qubits;
        let q = _all_qubits[0:1];
        h q[0];
        cx q[0], q[1];
    stats:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
    virtual_physical_mapping:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
  required:
    - transpiled_program
    - stats
    - virtual_physical_mapping
