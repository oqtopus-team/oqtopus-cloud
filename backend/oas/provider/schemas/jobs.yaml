jobs.JobStatusUpdate:
  type: object
  properties:
    status:
      type: string
      enum:
        - running
      example: running
  required:
    - status

jobs.JobStatusUpdateResponse:
  type: object
  properties:
    message:
      type: string
  required:
    - message

jobs.UpdateJobInfoRequest:
  type: object
  properties:
    transpiled_code:
      type: string
    result:
      type: string
    reason:
      type: string

jobs.UpdateJobInfoResponse:
  type: object
  properties:
    message:
      type: string
  required:
    - message
