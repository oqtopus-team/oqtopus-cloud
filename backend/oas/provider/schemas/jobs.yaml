jobs.JobId:
  type: string
  format: string
  example: "7af020f6-2e38-4d70-8cf0-4349650ea08c"

jobs.JobStatus:
  type: string
  enum:
    - submitted
    - ready
    - running
    - succeeded
    - failed
    - cancelled
  example: submitted

jobs.JobInfoSampling:
  type: object
  description: The descriptor of sampling jobs
  properties:
    job_type:
      type: string
      enum:
        - sampling
    code:
      type: string
      example: >-
        OPENQASM 3;
        qubit[2] q;
        bit[2] c;
        h q[0];
        cnot q[0], q[1];
        c = measure q;
  required:
    - job_type
    - code

jobs.JobInfoEstimation:
  type: object
  description: The descriptor of estimation jobs
  properties:
    job_type:
      type: string
      enum:
        - estimation
    code:
      type: string
      example: >-
        OPENQASM 3;
        qubit[2] q;
        bit[2] c;
        h q[0];
        cnot q[0], q[1];
        c = measure q;
    operator:
      type: string
      example: X 0 Y 1 Z 5 I 2
  required:
    - job_type
    - code
    - operator

jobs.JobInfoDesc:
  type: object
  oneOf:
    - $ref: "#/jobs.JobInfoEstimation"
    - $ref: "#/jobs.JobInfoSampling"

jobs.JobInfo:
  type: object
  properties:
    desc:
      $ref: "#/jobs.JobInfoDesc"
    transpiled_code:
      type: string
      example: >-
        OPENQASM 3;
        include "stdgates.inc";
        qubit[2] _all_qubits;
        let q = _all_qubits[0:1];
        h q[0];
        cx q[0], q[1];
    result:
      type: string
      description: The result of quantum computation, set only if the computation is successful.
      example: >-
        {
          "11": 4980,
          "00": 5020
        }
    reason:
      type: string
      description: The reason indicating why there is no result
  required:
    - desc

jobs.JobType:
  type: string
  enum:
    - sampling
    - estimation

jobs.JobDef:
  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
    name:
      type: string
      example: Bell State Sampling
    description:
      type: string
      example: Bell State Sampling Example
    device_id:
      type: string
      example: Kawasaki
    shots:
      type: integer
      minimum: 1
      maximum: 1e7
      example: "1000"
    job_info:
      $ref: "#/jobs.JobInfo"
    transpiler_info:
      type: string
      example: >-
        {
          "qubit_allocation": {
            "0"": 12,
            "1": 16
          },
          "skip_transpilation": false,
          "seed_transpilation": 873
        }
    simulator_info:
      type: string
      example: >-
        {
          "n_qubits": 5,
          "n_nodes": 12,
          "n_per_node": 2,
          "seed_simulation": 39058567,
          "simulation_opt": {
            "optimization_method": "light",
            "optimization_block_size": 1,
            "optimization_swap_level": 1
          }
        }
    mitigation_info:
      type: string
      example: |
        { "ro_error_mitigation": "pseudo_inverse" }
    status:
      $ref: "#/jobs.JobStatus"
    created_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    updated_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
  required:
    - job_id
    - device_id
    - job_info
    - shots
    - status
    - created_at
  example:
      job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
      name: Bell State Sampling
      description: Bell State Sampling Example
      device_id: Kawasaki
      job_info:
        desc:
          job_type: sampling
          code: >-
            OPENQASM 3;
            qubit[2] q;
            bit[2] c;
            h q[0];
            cnot q[0], q[1];
            c = measure q;
        transpiled_code: null
        result: null
        reason: null
      transpiler_info: >-
        {
          "qubit_allocation": {
            "0": 12,
            "1": 16
          },
          "skip_transpilation": false,
          "seed_transpilation": 873
        }
      simulator_info: >-
        {
          "n_qubits": 5,
          "n_nodes": 12,
          "n_per_node": 2,
          "seed_simulation": 39058567,
          "simulation_opt": {
            "optimization_method": "light",
            "optimization_block_size": 1,
            "optimization_swap_level": 1
          }
        }
      mitigation_info: |
        { "ro_error_mitigation": "pseudo_inverse" }
      job_type: sampling
      shots: 1000
      status: submitted
      created_at: 2022-10-19T11:45:34+09:00
      updated_at: 2022-10-19T11:45:34+09:00

