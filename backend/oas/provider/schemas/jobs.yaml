jobs.JobStatusUpdate:
  type: object
  properties:
    status:
      type: string
      enum:
        - running
      example: running
  required:
    - status

jobs.JobStatusUpdateResponse:
  type: object
  properties:
    message:
      type: string
  required:
    - message

jobs.UpdateJobInfoRequest:
  type: object
  properties:
    overwrite_status:
      description: >-
        Overwrite the job status. Use with caution to avoid putting
        the job into an inconsistent state. If this field is not
        specified, the status will be updated automatically.
      $ref: "#/jobs.JobStatus"
    execution_time:
      type: number
      description: >-
        Execution time for quantum computation. Specify the time in seconds,
        including up to milliseconds.
    transpiled_program:
      type: string
    result:
      $ref: "#/jobs.JobResult"
    message:
      type: string

jobs.UpdateJobInfoResponse:
  type: object
  properties:
    message:
      type: string
  required:
    - message
