devices.DeviceDataUpdate:
  discriminator:
    propertyName: command
    mapping:
      DeviceStatusUpdate: '#/devices.DeviceStatusUpdate'
      DevicePendingJobsUpdate: '#/devices.DevicePendingJobsUpdate'
      DeviceCalibrationUpdate: '#/devices.DeviceCalibrationUpdate'
  oneOf:
  - $ref: '#/devices.DeviceStatusUpdate'
  - $ref: '#/devices.DevicePendingJobsUpdate'
  - $ref: '#/devices.DeviceCalibrationUpdate'


devices.DeviceDataUpdateResponse:
  type: object
  properties:
    message:
      type: string
      nullable: false
      default: Device's data updated
      example: Device's data updated
  required:
    - message

devices.DeviceStatusUpdate:
  type: object
  properties:
    command:
      type: string
      example: DeviceStatusUpdate
      nullable: false
    status:
      type: string
      enum:
        - available
        - unavailable
      nullable: false
    available_at:
      description: Parameter mandatory and valid for status `unavailable`
      type: string
      format: date-time
      example: 2023-09-10T14:00:00
      nullable: true
  required:
    - command
    - status

devices.DevicePendingJobsUpdate:
  type: object
  properties:
    command:
      type: string
      example: DevicePendingJobsUpdate
      nullable: false
    n_pending_jobs:
      type: integer
      nullable: true
  required:
    - command

devices.DeviceCalibrationUpdate:
  type: object
  properties:
    command:
      type: string
      nullable: false
      example: DeviceCalibrationUpdate
    device_info:
      description: Calibration_data and n_nodes etc. Make sure that the value is a valid JSON data.
      type: string
      nullable: true
      example: >-
        {
          "n_nodes": 512,
          "calibration_data": {
            "qubit_connectivity": [
              "(1,4)",
              "(4,5)",
              "(5,8)"
            ],
            "t1": {
              "0": 55.51,
              "1": 37.03,
              "2": 57.13
            }
          }
        }
    calibrated_at:
      description: Parameter mandatory and valid if calibrationData not null
      type: string
      format: date-time
      example: 2023-09-10T14:00:00
      nullable: true
  required:
    - command
