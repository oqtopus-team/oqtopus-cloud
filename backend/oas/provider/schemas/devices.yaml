devices.UpdateDeviceRequest:
  type: object
  properties:
    n_qubits:
      type: integer
      nullable: true

devices.UpdateDeviceResponse:
  type: object
  properties:
    message:
      type: string
      nullable: false
      default: Device is successfully updated.
      example: Device is successfully updated.
  required:
    - message


devices.DeviceDataUpdateResponse:
  type: object
  properties:
    message:
      type: string
      nullable: false
      default: Device data updated
      example: Device data updated
  required:
    - message

devices.DeviceInfoUploadPresignedURL:
  type: object
  description: Presigned URL for uploading device_info.zip to OQTOPUS cloud.
  properties:
    url:
      type: string
      example: https://oqtopus-cloud.s3.amazonaws.com/
    fields:
      type: object
      additionalProperties: true
  required:
    - url
    - fields

devices.DeviceInfoUploadResponse:
  type: object
  properties:
    upload_id:
      type: string
      description: Upload identifier for confirming the specific device_info upload.
    presigned_url:
      $ref: "#/devices.DeviceInfoUploadPresignedURL"
  required:
    - upload_id
    - presigned_url

devices.DeviceStatusUpdate:
  type: object
  properties:
    status:
      type: string
      enum:
        - available
        - unavailable
      nullable: false
  required:
    - status

devices.DeviceInfoUpdate:
  type: object
  properties:
    upload_id:
      description: Upload identifier returned by the device_info upload URL endpoint.
      type: string
      example: 4a955d4fb28b4b699cdb8ad2274d3738
    calibrated_at:
      description: Calibration timestamp for the uploaded device_info.
      type: string
      format: date-time
      example: 2023-09-10T14:00:00Z
  required:
    - upload_id
    - calibrated_at
