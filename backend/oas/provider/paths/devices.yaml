devices.device_info:
    patch:
      tags:
      - devices
      summary: "Confirm uploaded device_info and update calibrated timestamp"
      description: "Confirm the uploaded device_info for the selected device and update its calibrated timestamp. Call this endpoint only after the upload to the presigned URL has completed successfully. If the upload fails, the caller must not confirm the calibration update."
      operationId: patchDeviceInfo
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: device_id
          description: "Device ID"
          required: true
          schema:
            type: string
            nullable: false
            example: "qulacs"
      requestBody:
        description: "Calibration timestamp for the uploaded device_info."
        content:
          application/json:
            schema:
              $ref: "../schemas/devices.yaml#/devices.DeviceInfoUpdate"
      responses:
        '200':
          description: Device's data updated
          content:
            application/json:
              schema:
                $ref: '../schemas/devices.yaml#/devices.DeviceDataUpdateResponse'
              example:
                message: Device's data updated
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '../schemas/error.yaml#/error.BadRequest'
              example:
                message: Bad request malformed input data
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '../schemas/error.yaml#/error.NotFoundError'
              example:
                message: Device not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '../schemas/error.yaml#/error.InternalServerError'
              example:
                message: Internal server error

devices.device_info.upload:
    get:
      tags:
      - devices
      summary: "Generate a presigned URL to upload device_info"
      description: "Generate a presigned URL to upload device_info for the selected device. Upload device_info.zip to this URL, then call PATCH /devices/{device_id}/device_info only after the upload succeeds."
      operationId: getDeviceInfoUploadUrl
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: device_id
          description: "Device ID"
          required: true
          schema:
            type: string
            nullable: false
            example: "qulacs"
      responses:
        '200':
          description: Device_info upload URL generated
          content:
            application/json:
              schema:
                $ref: '../schemas/devices.yaml#/devices.DeviceInfoUploadResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '../schemas/error.yaml#/error.NotFoundError'
              example:
                message: Device not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '../schemas/error.yaml#/error.InternalServerError'
              example:
                message: Internal server error
