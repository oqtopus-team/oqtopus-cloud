jobs:
  get:
    tags:
      - jobs
    summary: Search jobs for a device
    description: Search jobs for a device
    operationId: get_jobs
    parameters:
      - in: query
        name: device_id
        required: true
        description: "Device identifier"
        schema:
          type: string
          nullable: false
          example: "Kawasaki"
      - in: query
        name: status
        required: false
        description: "Additional search parameter:<br/> Search jobs with specified status only"
        schema:
          $ref: "../schemas/jobs.yaml#/jobs.JobStatus"
      - name: fields
        in: query
        description: |-
          Allows to specify an exact list of job properties to fetch for a single job. Each element of the list must be a valid name of job property.

          If parameter is specified and requested job field is not defined for a job null is returned.

          If parameter is omitted all available job properties are returned.
        required: false
        schema:
          type: string
          maxLength: 1024
          example: "job_id,status,name"
      - in: query
        name: limit
        required: false
        description: "Additional search parameter:<br/> Set max number of quantum jobs to return in single request"
        schema:
          type: integer
          nullable: false
          example: 1
      - in: query
        name: timestamp
        description: "Additional search parameter:<br/> Jobs created after the specified timetsamp"
        schema: { type: string, format: date-time, example: "2022-12-15T15:54:46Z" }
    responses:
      "200":
        description: "List of jobs for a device"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/jobs.yaml#/jobs.Job"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
            example:
              message: Internal server error

jobs.job_id:
  get:
    summary: Get a job by ID
    description: Get a job by ID
    operationId: get_job
    tags:
      - jobs
    parameters:
      - in: path
        name: job_id
        required: true
        description: "Job identifier"
        schema: { type: string, nullable: false }
    responses:
      "200":
        description: "Return quantum job"
        content:
          application/json:
            schema:
              $ref: "../schemas/jobs.yaml#/jobs.JobDef"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: job not found

jobs.job_id.upload:
  get:
    summary: Get presigned URLs for upload
    description: Get presigned URLs for job information items upload
    operationId: get_upload
    tags:
      - jobs
    parameters:
      - name: job_id
        in: path
        required: true
        description: Job identifier
        schema: { type: string, nullable: false }
      - name: items
        in: query
        required: true
        description: |-
          A list of job information items to upload

          Available job information items are: `combined_program`, `transpile_result`, `result`, `sse_log`
        schema:
          type: string
          maxLength: 1024
          example: "result,sse_log"
    responses:
      "200":
        description: |-
          Return the list of presigned URL data for upload, arranged in the order specified by the items parameter.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/jobs.yaml#/jobs.JobInfoUploadPresignedURL"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: job not found

jobs.job_status:
  patch:
    summary: Update job status
    description: Update job status and status related data
    operationId: patch_job
    tags:
      - jobs
    parameters:
      - in: path
        name: job_id
        required: true
        description: "Job identifier"
        schema: { type: string, nullable: false }
    requestBody:
      description: "New job status and status related data"
      content:
        application/json:
          schema:
            $ref: "../schemas/jobs.yaml#/jobs.JobStatusUpdate"
    responses:
      "200":
        description: job data updated
        content:
          application/json:
            schema:
              $ref: "../schemas/jobs.yaml#/jobs.JobStatusUpdateResponse"
            example:
              message: job data updated
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: Job not found
      "409":
        description: Returned when the specified job is not in a status that allows transition to the requested status.
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.ConflictError"
            example:
              message: The specified job is not in a status that allows transition to the requested status.

jobs.job_id.transpiler_info:
  put:
    summary: "Overwrite selected quantum job's traspiler_info"
    description: |
      Overwrite selected quantum job's transpiler_info.
    operationId: update_job_transpiler_info
    tags:
      - jobs
    parameters:
      - in: path
        name: job_id
        required: true
        description: "Job identifier"
        schema: { type: string, nullable: false }
    requestBody:
      description: "Modifications applied to transpiler info"
      content:
        application/json:
          schema:
            $ref: "../schemas/jobs.yaml#/jobs.UpdateJobTranspilerInfoRequest"
    responses:
      "200":
        description: job info updated
        content:
          application/json:
            schema:
              $ref: "../schemas/jobs.yaml#/jobs.UpdateJobTranspilerInfoResponse"
            example:
              message: Job info updated.
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: Job not found
