mfa_reset_request:
  put:
    tags:
      - signup
    summary: MFA Reset Request
    description: Request to reset MFA
    operationId: request_to_reset_mfa
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/mfa_reset_request.yaml#/mfa_reset_request.MfaResetRequest'
    responses:
      '200':
        description: MFA reset successful
      '400':
        description: MFA reset failed
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.BadRequest'
      '401':
        description: Unauthorized
      '403':
        description: Not authorized
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.NotFoundError'
            example:
              message: User not found
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.InternalServerError'
