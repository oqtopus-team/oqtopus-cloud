announcements.GetAnnouncementResponse:
  type: object
  properties:
    id:
      type: integer
      example: 0
    title:
      type: string
      example: Example Title
    content:
      type: string
      example: Example Content
    start_time:
      type: string
      format: date-time
      example: "2022-10-19T11:45:34Z"
    end_time:
      type: string
      format: date-time
      example: "2022-12-19T11:45:34Z"
    publishable:
      type: boolean
      example: true
  required:
    - id
    - title
    - content
    - start_time
    - end_time
    - publishable

  example:
    id: 0
    title: Example Title
    content: Example Content
    start_time: "2022-10-19T11:45:34Z"
    end_time: "2022-12-19T11:45:34Z"
    publishable: true

announcements.GetAnnouncementsListResponse:
  properties:
    announcements:
      type: array
      items:
        $ref: "#/announcements.GetAnnouncementResponse"
