jobs.JobId:
  type: string
  example: 7af020f6-2e38-4d70-8cf0-4349650ea08c

jobs.GetJobStatusResponse:
  description: job status
  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
    status:
      $ref: "#/jobs.JobStatus"
  required: [
    job_id,status
  ]

jobs.RegisterJobResponse:
  description: Register new job
  type: object
  properties:
    job_id:
      $ref: '#/jobs.JobId'
    presigned_url:
      $ref: '#/jobs.JobInfoUploadPresignedURL'
  required:
    - job_id
    - presigned_url

jobs.JobStatus:
  type: string
  enum:
    - registered
    - submitted
    - ready
    - running
    - succeeded
    - failed
    - cancelled
  example: submitted

jobs.SubmitJobType:
  type: string
  enum:
    - estimation
    - sampling
    - multi_manual
    - sse
  example: sampling

jobs.JobType:
  type: string
  enum:
    - estimation
    - sampling
    - multi_manual
    - sse
  example: sampling

jobs.SubmitJobRequest:
  type: object
  properties:
    name:
      type: string
      example: Bell State Sampling
    description:
      type: string
      example: An example of Bell state sampling job
    device_id:
      type: string
      example: Kawasaki
    job_type:
      $ref: "#/jobs.SubmitJobType"
    transpiler_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "qubit_allocation": {
          "0": 12,
          "1": 16
        },
        "skip_transpilation": false,
        "seed_transpilation": 873
      }
    simulator_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "n_qubits": 5,
        "n_nodes": 12,
        "n_per_node": 2,
        "seed_simulation": 39058567,
        "simulation_opt": {
          "optimization_method": "light",
          "optimization_block_size": 1,
          "optimization_swap_level": 1
        }
      }
    mitigation_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "ro_error_mitigation": "pseudo_inverse"
      }
    shots:
      type: integer
      minimum: 1
      maximum: 1e7
      example: 1000
  required:
    - device_id
    - shots
    - job_type

jobs.Job:
  description: |-
    Represents a quantum job.

    Newly registered jobs (status=registered) must provide:
       - job_id,
       - status (registered)

    Fully defined jobs must also provide:
      - name
      - device_id
      - job_type,
      - shots
      - job_info

    Other properties and optional and depend on job type and status.

  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
    name:
      type: string
      example: Bell State Sampling
    description:
      type: string
      example: Bell State Sampling Example
    job_type:
      $ref: "#/jobs.JobType"
    status:
      $ref: "#/jobs.JobStatus"
    device_id:
      type: string
      example: "Kawasaki"
    shots:
      type: integer
      minimum: 1
      maximum: 1e7
      example: "1000"
    job_info:
      $ref: "#/jobs.JobInfo"
    transpiler_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "qubit_allocation": {
          "0": 12,
          "1": 16
        },
        "skip_transpilation": false,
        "seed_transpilation": 873
      }
    simulator_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "n_qubits": 5,
        "n_nodes": 12,
        "n_per_node": 2,
        "seed_simulation": 39058567,
        "simulation_opt": {
          "optimization_method": "light",
          "optimization_block_size": 1,
          "optimization_swap_level": 1
        }
      }
    mitigation_info:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "ro_error_mitigation": "pseudo_inverse"
      }
    execution_time:
      type: number
      example: "10.123"
    submitted_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    ready_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    running_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    ended_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
  required: []
  example:
      job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
      name: Bell State Sampling
      description: Bell State Sampling Example
      device_id: Kawasaki
      job_type: estimation
      job_info: >-
        {"input": https://oqtopus-cloud.s3.amazonaws.com/jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/input.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D}
      transpiler_info: >-
        { "qubit_allocation": { "0": 12, "1": 16 }, "skip_transpilation": false, "seed_transpilation": 873 },
      simulator_info: >-
        { "n_qubits": 5, "n_nodes": 12, "n_per_node": 2, "seed_simulation": 39058567, "simulation_opt": { "optimization_method": "light", "optimization_block_size": 1, "optimization_swap_level": 1 } }
      mitigation_info: >-
        { "ro_error_mitigation": "pseudo_inverse" }
      shots: 1000
      status: submitted
      execution_time: 10.123
      submitted_at: 2022-10-19T11:45:34+09:00
      ready_at: 2022-10-19T11:45:34+09:00
      running_at: 2022-10-19T11:45:34+09:00
      ended_at: 2022-10-19T11:45:34+09:00

