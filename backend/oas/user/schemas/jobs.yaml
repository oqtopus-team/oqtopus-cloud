jobs.JobInfoUploadPresignedURL:
  description: |-
    Presigned URL for uploading file to OCTOPUS cloud.
  type: object
  properties:
    url:
      type: string
      example: https://oqtopus-cloud.s3.amazonaws.com/
    fields:
      type: object
      properties:
        key:
          type: string
          example: jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/filename.zip
        AWSAccessKeyId:
          type: string
        x-amz-security-token:
          type: string
        policy:
          type: string
        signature:
          type: string

jobs.JobInfoDownloadPresignedURL:
  description: |-
    Presigned URL for downloading a file from OCTOPUS cloud.
  type: string
  example: https://oqtopus-cloud.s3.amazonaws.com/jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/filename.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D

jobs.JobInfo:
  description: |-
    Presigned URLs for downloading relevant job information .zip files from OQTOPUS cloud.
  type: object
  properties:
    input:
      allOf:
        - $ref: "#/jobs.JobInfoDownloadPresignedURL"
        - description: Content of the file will match `jobs.S3SubmitJobInfo` schema.
    combined_program:
      allOf:
        - $ref: "#/jobs.JobInfoDownloadPresignedURL"
        - description: For multiprogramming jobs, this file contains the combined circuit.
    result:
      allOf:
        - $ref: "#/jobs.JobInfoDownloadPresignedURL"
        - description: Content of the file will match `jobs.S3JobResult` schema.
    transpile_result:
      allOf:
        - $ref: "#/jobs.JobInfoDownloadPresignedURL"
        - description: Content of the file will match `jobs.S3TranspileResult` schema.
    sse_log:
      allOf:
        - $ref: "#/jobs.JobInfoDownloadPresignedURL"
        - description: File available only for sse jobs.
    message:
      type: string
  required:
    - input

jobs.S3OperatorItem:
  type: object
  properties:
    pauli:
      type: string
      description: The Pauli string.
      example: "X 0 X 1"
    coeff:
      type: number
      description: "Coefficient number in the Pauli string representation."
      example: 1.0
  required:
    - pauli

jobs.S3SubmitJobInfo:
  type: object
  properties:
    program:
      type: array
      description: >-
        A list of OPENQASM3 program.
        For non-multiprogramming jobs, this field is assumed to contain exactly one program.
        Otherwise, those programs are combined according to the multiprogramming machinery.
      items:
        type: string
      example: >-
          [ "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;" ]
    operator:
      type: array
      items:
        $ref: "#/jobs.S3OperatorItem"
  required:
    - program

jobs.S3SamplingResult:
  type: object
  description: "*(Only for sampling jobs)* JSON string representing the sampling result"
  properties:
    counts:
      type: object
      properties: {}
      additionalProperties: true
      example: {
        "00": 84,
        "11": 387,
        "10": 454,
        "01": 75
      }
    divided_counts:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
      example: {
        "0": {
          "00": 84,
          "11": 387,
          "10": 454,
          "01": 75
        },
        "1": {
          "00": 84,
          "11": 387,
          "10": 454,
          "01": 75
        }
      }

jobs.S3EstimationResult:
  type: object
  description: |
      *(Only for estimation jobs)* The estimated expectation value and the standard deviation
      of the operators specified in `job_info.operator` field which is intended to be provided for estimation jobs.
  properties:
    exp_value:
      description: The estimated expectation value
      type: number
    stds:
      description: "The standard deviation value"
      type: number

jobs.S3JobResult:
  type: object
  properties:
    sampling:
      $ref: "#/jobs.S3SamplingResult"
    estimation:
      $ref: "#/jobs.S3EstimationResult"
  additionalProperties: true
  required: []

jobs.S3TranspileResult:
  type: object
  properties:
    transpiled_program:
      type: string
      nullable: true
      example: >-
        OPENQASM 3;
        include "stdgates.inc";
        qubit[2] _all_qubits;
        let q = _all_qubits[0:1];
        h q[0];
        cx q[0], q[1];
    stats:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
    virtual_physical_mapping:
      type: object
      properties: {}
      additionalProperties: true
      nullable: true
  required:
    - transpiled_program
    - stats
    - virtual_physical_mapping
