jobs.JobId:
  type: string
  example: 7af020f6-2e38-4d70-8cf0-4349650ea08c

jobs.GetJobStatusResponse:
  description: job status
  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
    status:
      $ref: "#/jobs.JobStatus"
  required: [
    job_id,status
  ]

jobs.SubmitJobResponse:
  description: submit a job
  type: object
  properties:
    job_id:
      $ref: '#/jobs.JobId'
  required:
    - job_id

jobs.OperatorItem:
  type: object
  properties:
    pauli:
      type: string
      description: The Pauli string.
      example: "X 0 X 1"
    coeff:
      description: "Complex coefficient number in the Pauli string representation."
      type: array
      items:
        type: number
      minItems: 1
      maxItems: 2
  required:
    - pauli

jobs.EstimationResult:
  type: object
  description: |
      *(Only for estimation jobs)* The estimated expectation value and the standard deviation
      of the operators specified in `job_info.operator` field which is intended to be provided for estimation jobs.
  properties:
    exp_value:
      description: |
        This field must contain an array of numbers with a maximum length of 2, representing a complex number.
        The first element corresponds to the real part, and the second corresponds to the imaginary part.
      type: array
      items:
        type: number
      minItems: 1
      maxItems: 2
    stds:
      description: "(Only for estimation jobs) The standard deviation value"
      type: number

jobs.JobResult:
  type: object
  properties:
    counts:
      description: "*(Only for sampling jobs)* JSON string representing the sampling result"
      type: string
      example: >-
        {
          "10": 84,
          "11": 387,
          "10": 454,
          "01": 75
        }

    estimation:
      $ref: "#/jobs.EstimationResult"

    divided_result:
      type: object
      description: "Assumed to be used for multiprogramming, but currently not supported yet."
      properties: {}
    properties:
      type: string
    transpile_result:
      type: object
      properties:
        virtual_physical_mapping:
          type: string
  required: []

jobs.JobInfo:
  type: object
  properties:
    program:
      type: array
      description: >-
        A list of OPENQASM3 program.
        For non-multiprogramming jobs, this field is assumed to contain exactly one program.
        Otherwise, those programs are combined according to the multiprogramming machinery.
      items:
        type: string
      example: >-
          [ "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;" ]

    combined_program:
      type: string
      description: >-
        For multiprogramming jobs, this field contains the combined circuit.

    operator:
      description: |
        *(Only for estimation jobs)* The operator (or observable) for which the expectation
        value is to be estimated.
      type: array
      items:
        $ref: "#/jobs.OperatorItem"

    transpiled_program:
      type: string
      example: >-
        OPENQASM 3;
        include "stdgates.inc";
        qubit[2] _all_qubits;
        let q = _all_qubits[0:1];
        h q[0];
        cx q[0], q[1];
    result:
      $ref: "#/jobs.JobResult"
    message:
      type: string
      description: Describing the reason why there is no result
  required:
    - program

jobs.JobStatus:
  type: string
  enum:
    - submitted
    - ready
    - running
    - succeeded
    - failed
    - cancelled
  example: submitted

jobs.TranspilerInfo:
  type: string
  example: >-
    {
      "qubit_allocation": {
        "0": 12,
        "1": 16
      },
      "skip_transpilation": false,
      "seed_transpilation": 873
    }

jobs.SimulatorInfo:
  type: string
  example: >-
    {
      "n_qubits": 5,
      "n_nodes": 12,
      "n_per_node": 2,
      "seed_simulation": 39058567,
      "simulation_opt": {
        "optimization_method": "light",
        "optimization_block_size": 1,
        "optimization_swap_level": 1
      }
    }

jobs.MitigationInfo:
  type: string
  example: >-
    {
      "ro_error_mitigation": "pseudo_inverse"
    }

jobs.JobType:
  type: string
  enum:
    - estimation
    - sampling
  example: sampling

jobs.JobDef:
  type: object
  properties:
    job_id:
      $ref: "#/jobs.JobId"
    name:
      type: string
      example: Bell State Sampling
    description:
      type: string
      example: Bell State Sampling Example
    job_type:
      $ref: "#/jobs.JobType"
    status:
      $ref: "#/jobs.JobStatus"
    device_id:
      type: string
      example: "Kawasaki"
    shots:
      type: integer
      minimum: 1
      maximum: 1e7
      example: "1000"
    job_info:
      $ref: "#/jobs.JobInfo"
    transpiler_info:
      $ref: "#/jobs.TranspilerInfo"
    simulator_info:
      $ref: "#/jobs.SimulatorInfo"
    mitigation_info:
      $ref: "#/jobs.MitigationInfo"
    execution_time:
      type: number
      example: "10.123"
    submitted_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    ready_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    running_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    ended_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    created_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    updated_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
  required:
    - job_id
    - name
    - job_type
    - status
    - device_id
    - shots
    - job_info
  example:
      job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
      name: Bell State Sampling
      description: Bell State Sampling Example
      device_id: Kawasaki
      job_type: estimation
      job_info:
        program:
          - "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;"
        operator:
          - pauli: "X 0 Y 1 Z 5 I 2"
            coeffs: [ 1.0 ]
        transpiled_code: "{}"
        result: "{}"
        reason: ""
      transpiler_info: >-
        { "qubit_allocation": { "0": 12, "1": 16 }, "skip_transpilation": false, "seed_transpilation": 873 },
      simulator_info: >-
        { "n_qubits": 5, "n_nodes": 12, "n_per_node": 2, "seed_simulation": 39058567, "simulation_opt": { "optimization_method": "light", "optimization_block_size": 1, "optimization_swap_level": 1 } }
      mitigation_info: >-
        { "ro_error_mitigation": "pseudo_inverse" }
      shots: 1000
      status: submitted
      execution_time: 10.123
      submitted_at: 2022-10-19T11:45:34+09:00
      ready_at: 2022-10-19T11:45:34+09:00
      running_at: 2022-10-19T11:45:34+09:00
      ended_at: 2022-10-19T11:45:34+09:00
      created_at: 2022-10-19T11:45:34+09:00
      updated_at: 2022-10-19T11:45:34+09:00

jobs.SubmitJobInfo:
  description: "All fields in this schema also exist in the `JobInfo` schema and have the same meaning as their counterparts in the `JobInfo` schema."
  type: object
  properties:
    program:
      type: array
      description: >-
        A list of OPENQASM3 program.
        For non-multiprogramming jobs, this field is assumed to contain exactly one program.
        Otherwise, those programs are combined according to the multiprogramming machinery.
      items:
        type: string
      example: >-
          [ "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;" ]
    operator:
      type: array
      x-see-also:
        - '#/jobs.JonInfo.operator'
      items:
        $ref: "#/jobs.OperatorItem"
  required:
    - program

jobs.SubmitJobRequest:
  type: object
  properties:
    name:
      type: string
      example: Bell State Sampling
    description:
      type: string
      example: An example of Bell state sampling job
    device_id:
      type: string
      example: Kawasaki
    job_type:
      $ref: "#/jobs.JobType"
    job_info:
      $ref: "#/jobs.SubmitJobInfo"
    transpiler_info:
      type: string
      description: When specified, valid JSON string is required.
      example: "{}"
    simulator_info:
      type: string
      example: >-
        {
          "n_qubits": 5,
          "n_nodes": 12,
          "n_per_node": 2,
          "seed_simulation": 39058567,
          "simulation_opt": {
            "optimization_method": "light",
            "optimization_block_size": 1,
            "optimization_swap_level": 1
          }
        }
    mitigation_info:
      type: string
      description: "When specified, valid JSON string is required"
      example: "{}"
    shots:
      type: integer
      example: 1000
    status:
      $ref: "#/jobs.JobStatus"
      example: submitted
    created_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
    updated_at:
      type: string
      format: date-time
      example: 2022-10-19T11:45:34+09:00
  required:
    - name
    - device_id
    - shots
    - job_type
    - job_info

