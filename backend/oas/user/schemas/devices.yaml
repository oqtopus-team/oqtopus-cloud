devices.DeviceInfo:
  type: object
  properties:
    device_id:
      type: string
      example: "SVSim"
    device_type:
      type: string
      enum:
        - QPU
        - simulator
      example: "simulator"
    status:
      type:
        string
      enum:
        - available
        - unavailable
      example: "available"
    available_at:
      description: "Parameter mandatory and valid for 'unavailable' devices"
      type: string
      format: date-time
      example: "2022-10-19T11:45:34Z"
    n_pending_jobs:
      type: integer
      example: 8
    n_qubits:
      type: integer
      example: 39
    basis_gates:
      type: array
      items:
        type: string
      example: ["x", "y", "z", "h", "s", "sdg", "t", "tdg", "rx", "ry", "rz", "cx", "cz", "swap", "u1", "u2", "u3", "u", "p", "id", "sx", "sxdg"]
    supported_instructions:
      type: array
      items:
        type: string
      example: ["measure", "barrier", "reset"]
    device_info:
      description: "Presigned URL for downloading device_info."
      type: string
      example: "https://oqtopus-cloud.s3.amazonaws.com/devices/qulacs/device_info.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D"
    calibrated_at:
      description: "Parameter available only for `QPU` devices with available calibration data"
      type: string
      format: date-time
      example: "2022-10-19T11:45:34Z"
    description:
      type: string
      example: "State vector-based quantum circuit simulator"
  required:
    - device_id
    - device_type
    - status
    - n_pending_jobs
    - basis_gates
    - supported_instructions
    - description
  example:
      device_id: "SVSim"
      device_type: "simulator"
      status: "available"
      n_pending_jobs: 8
      n_qubits: 39
      basis_gates: ["x", "y", "z", "h", "s", "sdg", "t", "tdg", "rx", "ry", "rz", "cx", "cz", "swap", "u1", "u2", "u3", "u", "p", "id", "sx", "sxdg"]
      supported_instructions: ["measure", "barrier", "reset"]
      device_info: "https://oqtopus-cloud.s3.amazonaws.com/devices/qulacs/device_info.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D"
      calibrated_at: "2022-10-19T11:45:34Z"
      description: "State vector-based quantum circuit simulator"

devices.DeviceInfoHistoryEntry:
  type: object
  properties:
    history_uid:
      description: UUID assigned when the device history is issued.
      type: string
      example: "018f4c8a-7c2b-7f4d-9a2f-4f2f0b8f6f12"
    device_id:
      type: string
      example: qulacs
    calibrated_at:
      type: string
      format: date-time
      example: "2024-03-04T12:34:56Z"
    n_qubits:
      type: integer
      example: 64
    n_couplings:
      type: integer
      example: 72
  required:
    - history_uid
    - device_id
    - calibrated_at
    - n_qubits
    - n_couplings

devices.DeviceInfoHistoryDetail:
  allOf:
    - $ref: '#/devices.DeviceInfoHistoryEntry'
    - type: object
      properties:
        device_info:
          description: Presigned URL for downloading the historical device_info.zip.
          type: string
          example: "https://oqtopus-cloud.s3.amazonaws.com/devices/qulacs/history/20240304T123456000000Z/device_info.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE"
      required:
        - device_info

devices.DeviceInfoHistoryListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/devices.DeviceInfoHistoryEntry'
    total:
      type: integer
      example: 3
    limit:
      type: integer
      example: 100
    offset:
      type: integer
      example: 0
  required:
    - items
    - total
    - limit
    - offset
