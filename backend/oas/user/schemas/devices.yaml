devices.DeviceInfo:
  type: object
  properties:
    device_id:
      type: string
      example: "SVSim"
    device_type:
      type: string
      enum:
        - QPU
        - simulator
      example: "simulator"
    status:
      type:
        string
      enum:
        - available
        - unavailable
      example: "available"
    available_at:
      description: "Parameter mandatory and valid for 'unavailable' devices"
      type: string
      format: date-time
      example: "2022-10-19T11:45:34Z"
    n_pending_jobs:
      type: integer
      example: 8
    n_qubits:
      type: integer
      example: 39
    basis_gates:
      type: array
      items:
        type: string
      example: ["x", "y", "z", "h", "s", "sdg", "t", "tdg", "rx", "ry", "rz", "cx", "cz", "swap", "u1", "u2", "u3", "u", "p", "id", "sx", "sxdg"]
    supported_instructions:
      type: array
      items:
        type: string
      example: ["measure", "barrier", "reset"]
    device_info:
      description: "Presigned URL for downloading device_info."
      type: string
      example: "https://oqtopus-cloud.s3.amazonaws.com/devices/qulacs/device_info.json?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D"
    calibrated_at:
      description: "Parameter available only for `QPU` devices with available calibration data"
      type: string
      format: date-time
      example: "2022-10-19T11:45:34Z"
    description:
      type: string
      example: "State vector-based quantum circuit simulator"
  required:
    - device_id
    - device_type
    - status
    - n_pending_jobs
    - basis_gates
    - supported_instructions
    - description
  example:
      device_id: "SVSim"
      device_type: "simulator"
      status: "available"
      n_pending_jobs: 8
      n_qubits: 39
      basis_gates: ["x", "y", "z", "h", "s", "sdg", "t", "tdg", "rx", "ry", "rz", "cx", "cz", "swap", "u1", "u2", "u3", "u", "p", "id", "sx", "sxdg"]
      supported_instructions: ["measure", "barrier", "reset"]
      device_info: "https://oqtopus-cloud.s3.amazonaws.com/devices/qulacs/device_info.json?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D"
      calibrated_at: "2022-10-19T11:45:34Z"
      description: "State vector-based quantum circuit simulator"
