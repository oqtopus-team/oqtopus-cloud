openapi: 3.0.1
info:
  title: OQTOPUS Cloud User API
  version: '1.0'
  contact:
    name: oqtopus-team
    email: oqtopus-team[at]googlegroups.com
  description: OQTOPUS Cloud User API. This API is used to interact with the OQTOPUS Cloud service. The API provides endpoints to manage devices, jobs, and results.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: $OPENAPI_URL
    description: $OPENAPI_DESCRIPTION
paths:
  /devices:
    $ref: ./paths/devices.yaml#/devices
  /devices/{device_id}:
    $ref: ./paths/devices.yaml#/devices.device_id
  /jobs:
    $ref: ./paths/jobs.yaml#/jobs
  /jobs/{job_id}:
    $ref: ./paths/jobs.yaml#/jobs.job_id
  /jobs/{job_id}/status:
    $ref: ./paths/jobs.yaml#/jobs.job_id.status
  /jobs/{job_id}/cancel:
    $ref: ./paths/jobs.yaml#/jobs.job_id.cancel
  /jobs/{job_id}/sselog:
    $ref: ./paths/jobs.yaml#/jobs.job_id.sse_log
  /api-token:
    $ref: ./paths/api-token.yaml#/api-token
  /announcements:
    $ref: ./paths/announcements.yaml#/announcements
  /announcements/{announcement_id}:
    $ref: ./paths/announcements.yaml#/announcements.announcement_id
components:
  securitySchemes:
    BearerAuth:
      $ref: './schemas/security.yaml#/BearerAuth'
