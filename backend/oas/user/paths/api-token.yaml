components:
  securitySchemes:
    BearerAuth:
      $ref: './schemas/security.yaml#/BearerAuth'

api-token:
  get:
    tags:
      - api-token
    summary: "get api token"
    description: "Get api token"
    operationId: GetApiToken
    security:
      - BearerAuth: []
    responses:
      "200":
        description: "Return api token"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/api-token.yaml#/api-token.ApiToken"
      "403":
        description: Frobidden
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.ForbiddenError"
            example:
              message: Frobidden
      "404":
        description: "Not Found"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: "Not found the specified user"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
  post:
    tags:
      - api-token
    summary: "create api token"
    description: "Create api token"
    operationId: CreateApiToken
    security:
      - BearerAuth: []
    responses:
      "200":
        description: "Create api token"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/api-token.yaml#/api-token.ApiToken"
      "403":
        description: Frobidden
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.ForbiddenError"
            example:
              message: Frobidden
      "404":
        description: "Not Found"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: "Not found the specified user"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
  delete:
    tags:
      - api-token
    summary: "delete api token"
    description: "Delete api token"
    operationId: DeleteApiToken
    security:
      - BearerAuth: []
    responses:
      "200":
        description: "Delete api token"
      "403":
        description: Frobidden
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.ForbiddenError"
            example:
              message: Frobidden
      "404":
        description: "Not Found"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: "Not found the specified user"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
