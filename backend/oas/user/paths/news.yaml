news:
  get:
    tags:
      - News
    summary: "Get news list from backend"
    description: "Get news list from backend"
    operationId: get_news_list
    security:
      - BearerAuth: []
    parameters:
      - name: offset
        in: query
        description: "offset information"
        required: false
        schema: {type: string}
      - name: limit
        in: query
        description: "Limit information"
        required: false
        schema: {type: string}
    responses:
      "200":
        description: "Return news"
        content:
          application/json:
            schema:
              $ref: "../schemas/news.yaml#/news.GetNewsListResponse"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
news.news_id:
  get:
    tags:
    - News
    summary: "Get selected news"
    description: "Get selected news"
    operationId: get_news
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: news_id
        description: "news ID"
        required: true
        schema:
          type: integer
          example: 0
    responses:
      "200":
        description: "Return selected news"
        content:
          application/json:
            schema:
              $ref: "../schemas/news.yaml#/news.GetNewsResponse"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "401":
        description: "Unauthorized"
      "403":
        description: "Not authorized"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: News not found
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
            example:
              message: Internal server error
