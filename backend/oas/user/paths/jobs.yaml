jobs:
  get:
    tags:
      - job
    summary: "List all quantum jobs"
    description: |-
        By default, all available job's properties are returned. Use 'fields' parameter to specify exact list of properties to get for each job.

        List of jobs can be filtered by job creation time or search text with 'start_time', 'end_time' and 'q' parameters.

        Jobs are fetched with the pagination mechanism. This can be configured with 'page' and 'perPage' parameters. Check response's 'Link' header for pagination details.
    operationId: list_jobs
    security:
      - BearerAuth: []
    parameters:
      - name: fields
        in: query
        description: |-
          Allows to specify an exact list of job properties to fetch for a single job. Each element of the list must be a valid name of job property.

          If parameter is specified and requested job field is not defined for a job null is returned.

          If parameter is omitted all available job properties are returned. Undefined job properties (null properties) are not included in the response.
        required: false
        schema:
          type: string
          maxLength: 1024
          example: "job_id,status,name"
      - name: start_time
        in: query
        description: |-
          Allows to filter the list of jobs to fetch by creation time. If specified only jobs with creation time  (createdAt property) >= start_time are returned.
        required: false
        schema:
          type: string
          format: date-time
          example: "2022-10-19T11:45:34+09:00"
      - name: end_tiime
        in: query
        description: |-
          Allows to filter the list of jobs to fetch by to creation time. If specified only jobs with creation time (createdAt property) <= end_time are returned.
        required: false
        schema:
          type: string
          format: date-time
          example: "2022-10-19T11:45:34+09:00"
      - name: q
        in: query
        description: |-
          Allows to filter the list of jobs to fetch by job's name and description. If specified only jobs which name or description contains specified search string are returned.
        required: false
        schema:
          type: string
          maxLength: 1024
          example: "Bell"
      - name: page
        in: query
        description: |-
          Set jobs list page number to fetch.
          If requested page number exceeds number of all pages last page is returned.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 4294967295
          default: 1
      - name: size
        in: query
        description: |-
          Configure number of jobs per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 65535
          default: 10
      - name: order
        in: query
        description: |-
          Specify jobs order according to creation time (createdAt property)
        required: false
        schema:
          type: string
          enum:
            ["DESC", "ASC"]
          default: "ASC"
    responses:
      "200":
        description: "Return a list of quantum jobs"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/jobs.yaml#/jobs.JobBase"
            # example:
            #   [
            #     {
            #       "job_id": "7af020f6-2e38-4d70-8cf0-4349650ea08c",
            #       "name": "Bell State Sampling",
            #       "description": "Bell State Sampling Example",
            #       "device_id": "Kawasaki",
            #       "job_type": "estimation",
            #       "job_info": {
            #         "input": "https://oqtopus-cloud.s3.amazonaws.com/jobs/7af020f6-2e38-4d70-8cf0-4349650ea08c/input.zip?AWSAccessKeyId=AKIAIOSFODNN7EXAMPLE&Expires=1714425600&Signature=abc123def456ghi789jkl%2Fsignature%3D",
            #         "combined_program": null,
            #         "result": null,
            #         "transpile_result": null,
            #         "sse_log": null
            #       },
            #       "transpiler_info": {
            #         "qubit_allocation": { "0": 12, "1": 16 },
            #         "skip_transpilation": false,
            #         "seed_transpilation": 873
            #       },
            #       "simulator_info": {
            #         "n_qubits": 5,
            #         "n_nodes": 12,
            #         "n_per_node": 2,
            #         "seed_simulation": 39058567,
            #         "simulation_opt": {
            #           "optimization_method": "light",
            #           "optimization_block_size": 1,
            #           "optimization_swap_level": 1
            #         }
            #       },
            #       "mitigation_info": {
            #         "ro_error_mitigation": "pseudo_inverse"
            #       },
            #       "shots": 1000,
            #       "status": "submitted",
            #       "execution_time": null,
            #       "submitted_at": "2022-10-19T11:45:34+09:00",
            #       "ready_at": null,
            #       "running_at": null,
            #       "ended_at": null
            #     },
            #     {
            #       "job_id": "0682b528-aef9-7492-8000-d8b69371c5b5",
            #       "name": "",
            #       "description": null,
            #       "device_id": null,
            #       "job_type": "none",
            #       "job_info": null,
            #       "transpiler_info": null,
            #       "simulator_info": null,
            #       "mitigation_info": null,
            #       "shots": 0,
            #       "status": "registered",
            #       "execution_time": null,
            #       "submitted_at": null,
            #       "ready_at": null,
            #       "running_at": null,
            #       "ended_at": null
            #     }
            #   ]
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.UnauthorizedError'
            example:
              message: Unauthorized
  post:
    tags:
      - job
    summary: "Register new job"
    description: "Register new job and generate a presigned URL to upload job information (`jobs.S3SubmitJobInfo`) to OQTOPUS cloud."
    operationId: register_job_id
    security:
      - BearerAuth: []
    responses:
      "200":
        description: "Return new job_id and presigned URL for job information upload"
        content:
          application/json:
            schema:
              $ref: "../schemas/jobs.yaml#/jobs.RegisterJobResponse"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
            example:
              message: Bad request malformed input data
      "401":
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.UnauthorizedError"
            example:
              message: Unauthorized

jobs.job_id:
  get:
    tags:
      - job
    summary: "Get selected job"
    description: "Get selected job"
    operationId: get_job
    security:
      - BearerAuth: []
    parameters:
        - in: path
          name: job_id
          required: true
          description: "Job identifier"
          schema: {type: string}
    requestBody:
       required: false
       content: {}
    responses:
      "200":
        description: "Return quantum job"
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "../schemas/jobs.yaml#/jobs.SubmittedJob"
              - $ref: "../schemas/jobs.yaml#/jobs.RegisteredJob"
            # examples:
            #   submitted_job:
            #     description: Submitted job example
            #     value:
            #       {
            #         "job_id": "7af020f6-2e38-4d70-8cf0-4349650ea08c",
            #         "name": "Bell State Sampling",
            #         "description": "Bell State Sampling Example",
            #         "device_id": "Kawasaki",
