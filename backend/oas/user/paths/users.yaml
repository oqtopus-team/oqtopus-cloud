users.me:
  get:
    tags:
      - users
    summary: Get current user
    description: Get current user
    operationId: get_current_user
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Return current user
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/users.GetOneUserResponse'
      '401':
        description: Unauthorized
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.NotFoundError'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.InternalServerError'
  patch:
    tags:
      - users
    summary: Update current user
    description: Update current user
    operationId: update_current_user
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../schemas/users.yaml#/users.UpdateUserRequest'
    responses:
      '200':
        description: Return current user
        content:
          application/json:
            schema:
              $ref: '../schemas/users.yaml#/users.GetOneUserResponse'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.BadRequest'
      '401':
        description: Unauthorized
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.NotFoundError'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.InternalServerError'
  delete:
    tags:
      - users
    summary: Delete current user
    description: Delete current user
    operationId: delete_current_user
    security:
      - BearerAuth: []
    responses:
      '204':
        description: Current user deleted
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.ForbiddenError'
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.NotFoundError'
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.InternalServerError'