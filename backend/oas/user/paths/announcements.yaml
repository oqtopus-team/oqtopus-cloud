announcements:
  get:
    tags:
      - announcements
    summary: "Get announcements list from backend"
    description: "Get announcements list from backend"
    operationId: get_announcements_list
    security:
      - BearerAuth: []
    parameters:
      - name: offset
        in: query
        description: "offset information"
        required: false
        schema: {type: string}
      - name: limit
        in: query
        description: "Limit information"
        required: false
        schema: {type: string}
      - name: order
        in: query
        description: |-
          Specify order according to start time
        required: false
        schema:
          type: string
          enum:
            ["DESC", "ASC"]
          default: "ASC"
      - name: current_time
        in: query
        description: Allows to filter the list of announcements to fetch by provided time. If specified only announcements with start_time <= current_time and end_time >= current_time are returned.
        required: false
        schema:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34Z'
    responses:
      "200":
        description: "Return announcements"
        content:
          application/json:
            schema:
              $ref: "../schemas/announcements.yaml#/announcements.GetAnnouncementsListResponse"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
announcements.announcement_id:
  get:
    tags:
    - announcements
    summary: "Get selected announcement"
    description: "Get selected announcement"
    operationId: get_announcement
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: announcement_id
        description: "announcement ID"
        required: true
        schema:
          type: integer
          example: 0
    responses:
      "200":
        description: "Return selected announcement"
        content:
          application/json:
            schema:
              $ref: "../schemas/announcements.yaml#/announcements.GetAnnouncementResponse"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequest"
      "401":
        description: "Unauthorized"
      "403":
        description: "Not authorized"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"