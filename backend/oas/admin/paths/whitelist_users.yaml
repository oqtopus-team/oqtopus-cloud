whitelist_users:
  get:
    tags:
      - WhitelistUsers
    summary: "List whitelist users"
    description: "List whitelist users"
    operationId: list_whitelist_users
    security:
      - BearerAuth: []
    parameters:
      - name: offset
        in: query
        description: "offset information"
        required: false
        schema: {type: string}
      - name: limit
        in: query
        description: "Limit information"
        required: false
        schema: {type: string}
    responses:
      "200":
        description: "Return a list of whitelist users"
        content:
          application/json:
            schema:
              $ref: "../schemas/whitelist_users.yaml#/whitelist_users.ListWhitelistUsersResponse"
      '400':
        description: "Bad Request"
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/error.BadRequestError'
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
  post:
    tags:
      - WhitelistUsers
    summary: "register a user to the whitelist"
    description: "register a user to the whitelist"
    operationId: register_whitelist_user
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/whitelist_users.yaml#/whitelist_users.RegisterWhitelistUsersRequest"
    responses:
      "200":
        description: "Success register a user to the whitelist"
        content:
          application/json:
            schema:
              $ref: "../schemas/success.yaml#/success.SuccessResponse"
      "400":
        description: "Bad Request"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequestError"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
  delete:
    tags:
      - WhitelistUsers
    summary: "delete a user from the whitelist"
    description: "delete a user from the whitelist"
    operationId: delete_whitelist_user
    security:
      - BearerAuth: []
    parameters:
      - name: user_emails
        in: query
        description: "email of the user to be deleted"
        required: true
        schema:
          $ref: "../schemas/whitelist_users.yaml#/whitelist_users.WhitelistUsersDeleteRequest"
    responses:
      "204":
        description: "Delete success"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
