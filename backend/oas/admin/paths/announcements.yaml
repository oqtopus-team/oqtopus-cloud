announcements:
  get:
    tags:
      - Announcements
    summary: "Get announcements list from backend"
    description: "Get announcements list from backend"
    operationId: get_announcements_list
    security:
      - BearerAuth: []
    parameters:
      - name: offset
        in: query
        description: "offset information"
        required: false
        schema: {type: string}
      - name: limit
        in: query
        description: "Limit information"
        required: false
        schema: {type: string}
      - name: order
        in: query
        description: |-
          Specify order according to start time
        required: false
        schema:
          type: string
          enum:
            ["DESC", "ASC"]
          default: "ASC"
    responses:
      "200":
        description: "Return announcements"
        content:
          application/json:
            schema:
              $ref: "../schemas/announcements.yaml#/announcements.GetAnnouncementsListResponse"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
  post:
    tags:
      - Announcements
    summary: "Register announcement to backend"
    description: "Register announcement to backend"
    operationId: announcement
    security:
      - BearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../schemas/announcements.yaml#/announcements.RegisterAnnouncementRequest"
    responses:
      "200":
        description: "Success register announcement"
        content:
          application/json:
            schema:
              $ref: "../schemas/success.yaml#/success.SuccessResponse"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequestError"
      "401":
        description: Unauthorized
      "403":
        description: "Not authorized : user is not admin"
      "500":
        description: "Internal Server Error"
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
announcements.announcement_id:
  get:
    tags:
    - Announcements
    summary: "Get selected announcement"
    description: "Get selected announcement"
    operationId: get_announcement
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: announcement_id
        description: "announcement ID"
        required: true
        schema:
          type: integer
          example: 0
    responses:
      "200":
        description: "Return selected announcement"
        content:
          application/json:
            schema:
              $ref: "../schemas/announcements.yaml#/announcements.GetAnnouncementResponse"
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequestError"
            example:
              message: Bad request malformed input data
      "401":
        description: "Unauthorized"
      "403":
        description: "Not authorized"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: Announcement not found
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
            example:
              message: Internal server error
  patch:
    tags:
    - Announcements
    summary: "Update data of selected announcement"
    description: "Update the properties of selected announcement."
    operationId: update_announcement
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: announcement_id
        description: "announcement ID"
        required: true
        schema:
          type: integer
          example: 0
    requestBody:
      description: "New announcement data"
      content:
        application/json:
          schema:
            $ref: "../schemas/announcements.yaml#/announcements.UpdateAnnouncementRequest"
    responses:
      "200":
        description: Announcement data updated
        content:
          application/json:
            schema:
              $ref: "../schemas/success.yaml#/success.SuccessResponse"
            example:
              message: Announcement data updated
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequestError"
            example:
              message: Bad request malformed input data
      "401":
        description: "Unauthorized"
      "403":
        description: "Not authorized"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: Announcement not found
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
            example:
              message: Internal server error
  delete:
    tags:
      - Announcements
    summary: "Delete announcement"
    description: "Delete announcement"
    operationId: delete_announcement
    security:
      - BearerAuth: []
    parameters:
      - in: path
        name: announcement_id
        description: "announcement ID"
        required: true
        schema:
          type: integer
          example: 0
    responses:
      "204":
        description: Announcement deleted
        content:
          application/json:
            schema:
              $ref: "../schemas/success.yaml#/success.SuccessResponse"
            example:
              message: Announcement deleted
      "400":
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.BadRequestError"
            example:
              message: Bad request malformed input data
      "401":
        description: "Unauthorized"
      "403":
        description: "Not authorized"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.NotFoundError"
            example:
              message: Announcement not found
      "500":
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../schemas/error.yaml#/error.InternalServerError"
