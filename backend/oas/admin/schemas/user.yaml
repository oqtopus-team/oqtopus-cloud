user.GetOneUserResponse:
  description: detail of users response
  type: object
  properties:
    id:
      type: "string"
    email:
      type: "string"
    name:
      type: "string"
    organization:
      type: "string"
    status:
      type: "integer"
      format: "int32"
    require_mfa_reset:
      type: "boolean"
  xml:
    name: "User"
  required: [
    id, email,
  ]

user.UserUpdateStatusRequest:
  type: "object"
  properties:
    status:
      type: "string"
      enum: ["1", "3"]
      description: "status 1: active, 3: inactive"