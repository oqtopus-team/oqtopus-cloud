whitelist_user.Email:
  type: "string"
  example: example@example.com

whitelist_user.WhitelistUserRegisterRequest:
  description: "Whitelist user register request"
  type: object
  properties:
    group_id:
      type: "string"
    email:
      type: "string"
    username:
      type: "string"
    organization:
      type: "string"

whitelist_user.GetWhitelistUserResponse:
  type: object
  properties:
    id:
      type: "integer"
      example: 1
    group_id:
      type: "string"
      example: group1
    email:
      $ref: "#/whitelist_user.Email"
    username:
      type: "string"
      example: exampleuser
    organization:
      type: "string"
      example: Example Organization
    is_signup_completed:
      type: "boolean"
      example: true
  required:
    - id
    - group_id
    - email
  example:
    id: 1
    group_id: group1
    email: example@example.com
    username: exampleuser
    organization: Example Organization
    is_signup_completed: true
