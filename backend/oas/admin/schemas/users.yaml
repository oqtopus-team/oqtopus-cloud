users.GetOneUserResponse:
  description: detail of users response
  type: object
  properties:
    id:
      type: string
    email:
      type: string
    display_name:
      type: string
    organization:
      type: string
    status:
      $ref: "#/users.UserStatus"
    group_id:
      type: string
    available_devices:
      oneOf:
        - type: array
          items:
            type: string
        - type: string
          enum:
            - '*'
  xml:
    name: User
  required: [id]

users.UserStatus:
  type: string
  enum:
    - approved
    - unapproved
    - suspended
  example: approved

users.UpdateUserRequest:
  type: object
  properties:
    email:
      type: string
    display_name:
      type: string
    organization:
      type: string
    status:
      $ref: "#/users.UserStatus"
    group_id:
      type: string
    available_devices:
      oneOf:
        - type: array
          items:
            type: string
        - type: string
          enum:
            - '*'

users.GetUsersResponse:
  properties:
    offset:
      type: string
    limit:
      type: string
    users:
      type: array
      items:
        $ref: "#/users.GetOneUserResponse"
