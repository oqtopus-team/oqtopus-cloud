users.GetOneUserResponse:
  description: detail of users response
  type: object
  properties:
    id:
      type: "integer"
    email:
      type: "string"
    name:
      type: "string"
    organization:
      type: "string"
    status:
      type: "string"
    group_id:
      type: "string"
    require_mfa_reset:
      type: "boolean"
  xml:
    name: "User"
  required: [
    id,
  ]

users.UpdateUserStatusRequest:
  type: "object"
  properties:
    status:
      type: "string"

users.GetUsersResponse:
  properties:
    offset:
      type: string
    limit:
      type: string
    users:
      type: array
      items:
        $ref: "#/users.GetOneUserResponse"
