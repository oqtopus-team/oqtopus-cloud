openapi: 3.0.1
info:
  title: OQTOPUS Cloud Admin API
  version: '1.0'
  contact:
    name: oqtopus-team
    email: oqtopus-team[at]googlegroups.com
  description: OQTOPUS Cloud Admin API. This API is used to interact with the OQTOPUS Cloud service. The API provides endpoints to manage devices, jobs, and results.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local server url
paths:
  /users:
    get:
      tags:
        - user
      summary: get users
      description: get users
      operationId: getUsers
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          description: offset information
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit information
          required: false
          schema:
            type: string
        - name: email
          in: query
          description: query email infomation
          required: false
          schema:
            type: string
        - name: name
          in: query
          description: query name information
          required: false
          schema:
            type: string
        - name: organization
          in: query
          description: query organization information
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: query user status
          required: false
          schema:
            $ref: '#/components/schemas/users.UserStatus'
        - name: group_id
          in: query
          description: query group ID
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users.GetUsersResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequestError'
              example:
                message: Invalid status
        '401':
          description: Unauthorized
        '403':
          description: 'Not authorized : user is not admin'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal Server Error
  /users/{user_id}:
    patch:
      tags:
        - user
      summary: update user status
      description: update user status
      operationId: updatetUserStatusById
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/users.UpdateUserStatusRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users.GetOneUserResponse'
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: User not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal Server Error
    delete:
      tags:
        - user
      summary: delete user
      description: delete user with designated id
      operationId: deleteUserById
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: User not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal Server Error
  /whitelist:
    get:
      tags:
        - WhitelistUsers
      summary: List whitelist users
      description: List whitelist users
      operationId: listWhitelistUsers
      security:
        - BearerAuth: []
      parameters:
        - name: offset
          in: query
          description: offset information
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit information
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Return a list of whitelist users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/whitelist_users.ListWhitelistUsersResponse'
        '401':
          description: Unauthorized
        '403':
          description: 'Not authorized : user is not admin'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
    post:
      tags:
        - WhitelistUsers
      summary: register a user to the whitelist
      description: register a user to the whitelist
      operationId: registerWhitelistUser
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/whitelist_users.RegisterWhitelistUsersRequest'
      responses:
        '200':
          description: Success register a user to the whitelist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success.SuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequestError'
        '401':
          description: Unauthorized
        '403':
          description: 'Not authorized : user is not admin'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
    delete:
      tags:
        - WhitelistUsers
      summary: delete a user from the whitelist
      description: delete a user from the whitelist
      operationId: deleteWhitelistUser
      security:
        - BearerAuth: []
      parameters:
        - name: user_emails
          in: query
          description: email of the user to be deleted
          required: true
          schema:
            $ref: '#/components/schemas/whitelist_users.WhitelistUsersDeleteRequest'
      responses:
        '204':
          description: Delete success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success.SuccessResponse'
        '401':
          description: Unauthorized
        '403':
          description: 'Not authorized : user is not admin'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
  /devices:
    get:
      tags:
        - devices
      summary: List available devices
      description: List available devices
      operationId: listDevices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Returns a list of available devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/devices.DeviceInfo'
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
    post:
      tags:
        - devices
      summary: Register a new device
      description: Register a new device to the system.
      operationId: registerDevice
      security:
        - BearerAuth: []
      requestBody:
        description: Device data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devices.DeviceBase'
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success.SuccessResponse'
              example:
                message: Device registered
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequestError'
              example:
                message: Bad request malformed input data
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
  /devices/{device_id}:
    get:
      tags:
        - devices
      summary: Get specified device details
      description: get device
      operationId: getDevice
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          description: Device identifier
          required: true
          schema:
            type: string
          example: Kawasaki
      responses:
        '200':
          description: device response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices.DeviceInfo'
        '404':
          description: Device with device_id not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
    patch:
      tags:
        - devices
      summary: Update data of selected device
      description: Update the properties of selected device.
      operationId: updateDeviceData
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: device_id
          description: Device ID
          required: true
          schema:
            type: string
            example: Kawasaki
      requestBody:
        description: New calibration data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devices.DeviceBase'
      responses:
        '200':
          description: Device's data updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success.SuccessResponse'
              example:
                message: Device's data updated
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequestError'
              example:
                message: Bad request malformed input data
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: Device not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal server error
    delete:
      tags:
        - devices
      summary: Delete a device
      description: Delete a device from the system.
      operationId: deleteDevice
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: device_id
          description: Device ID
          required: true
          schema:
            type: string
            example: Kawasaki
      responses:
        '204':
          description: Device deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/success.SuccessResponse'
              example:
                message: Device deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequestError'
              example:
                message: Bad request malformed input data
        '401':
          description: Unauthorized
        '403':
          description: Not authorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: Device not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    users.UserStatus:
      type: string
      enum:
        - approved
        - unapproved
        - suspended
      example: approved
    users.GetOneUserResponse:
      description: detail of users response
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        organization:
          type: string
        status:
          $ref: '#/components/schemas/users.UserStatus'
        group_id:
          type: string
        require_mfa_reset:
          type: boolean
      xml:
        name: User
      required:
        - id
    users.GetUsersResponse:
      properties:
        offset:
          type: string
        limit:
          type: string
        users:
          type: array
          items:
            $ref: '#/components/schemas/users.GetOneUserResponse'
    error.BadRequestError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    error.InternalServerError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    error.NotFoundError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    users.UpdateUserStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/users.UserStatus'
    whitelist_users.Email:
      type: string
      example: example@example.com
    whitelist_users.ListWhitelistUserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        group_id:
          type: string
          example: group1
        email:
          $ref: '#/components/schemas/whitelist_users.Email'
        username:
          type: string
          example: exampleuser
        organization:
          type: string
          example: Example Organization
        is_signup_completed:
          type: boolean
          example: true
      required:
        - id
        - group_id
        - email
      example:
        id: 1
        group_id: group1
        email: example@example.com
        username: exampleuser
        organization: Example Organization
        is_signup_completed: true
    whitelist_users.ListWhitelistUsersResponse:
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/whitelist_users.ListWhitelistUserResponse'
    whitelist_users.RegisterWhitelistUserRequest:
      description: Whitelist user register request
      type: object
      properties:
        group_id:
          type: string
        email:
          type: string
        username:
          type: string
        organization:
          type: string
    whitelist_users.RegisterWhitelistUsersRequest:
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/whitelist_users.RegisterWhitelistUserRequest'
    success.SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    whitelist_users.WhitelistUsersDeleteRequest:
      properties:
        user_emails:
          type: array
          items:
            $ref: '#/components/schemas/whitelist_users.Email'
    devices.DeviceInfo:
      type: object
      properties:
        device_id:
          type: string
          example: SVSim
        device_type:
          type: string
          enum:
            - QPU
            - simulator
          example: simulator
        status:
          type: string
          enum:
            - available
            - unavailable
          example: available
        available_at:
          description: Parameter mandatory and valid for 'unavailable' devices
          type: string
          format: date-time
          example: '2022-10-19T11:45:34'
        n_pending_jobs:
          type: integer
          example: 8
        n_qubits:
          type: integer
          example: 64
        basis_gates:
          type: array
          items:
            type: string
          example:
            - x
            - 'y'
            - z
            - h
            - s
            - sdg
            - t
            - tdg
            - rx
            - ry
            - rz
            - cx
            - cz
            - swap
            - u1
            - u2
            - u3
            - u
            - p
            - id
            - sx
            - sxdg
        supported_instructions:
          type: array
          items:
            type: string
          example:
            - measure
            - barrier
            - reset
        device_info:
          description: json format calibration_data and n_nodes etc
          type: string
        calibrated_at:
          description: Parameter available only for `QPU` devices with available calibration data
          type: string
          format: date-time
          example: '2022-10-19T11:45:34'
        description:
          type: string
          example: State vector-based quantum circuit simulator
      required:
        - device_id
        - device_type
        - status
        - n_pending_jobs
        - basis_gates
        - supported_instructions
        - description
      example:
        - device_id: SVSim
          device_type: simulator
          status: available
          n_pending_jobs: 8
          n_qubits: 39
          n_nodes: 512
          basis_gates:
            - x
            - 'y'
            - z
            - h
            - s
            - sdg
            - t
            - tdg
            - rx
            - ry
            - rz
            - cx
            - cz
            - swap
            - u1
            - u2
            - u3
            - u
            - p
            - id
            - sx
            - sxdg
          supported_instructions:
            - measure
            - barrier
            - reset
          device_info: |-
            {
              "n_nodes": 512,
              "calibration_data": {
                "qubit_connectivity": [ "(1,4)", "(4,5)", "(5,8)"],
                "t1": {
                  "0": 55.51,
                  "1": 37.03,
                  "2": 57.13
                }
              }
            }
          calibrated_at: '2022-10-19T11:45:34'
          description: State vector-based quantum circuit simulator
    devices.DeviceBase:
      type: object
      properties:
        device_info:
          type: string
          example: '{"device_id": "Kawasaki", "qubits": []}'
        device_type:
          type: string
          enum:
            - QPU
            - simulator
          example: simulator
        status:
          type: string
          enum:
            - available
            - unavailable
          example: available
        n_qubits:
          type: integer
          example: 64
        available_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34'
        calibrated_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34'
        basis_gates:
          type: string
          example: '["x", "y", "z", "h", "s", "sdg", "t", "tdg", "rx", "ry", "rz", "cx", "cz", "swap", "u1", "u2", "u3", "u", "p", "id", "sx", "sxdg"]'
        supported_instructions:
          type: string
          example: '["measure", "barrier", "reset"]'
        description:
          type: string
          example: Superconducting quantum computer
