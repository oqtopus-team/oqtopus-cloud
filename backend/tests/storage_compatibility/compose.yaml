# Disposable storage only; independent of the development stack and its data.
services:
  seaweedfs:
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: compatibility
      AWS_SECRET_ACCESS_KEY: compatibility-secret
    ports:
      - "127.0.0.1:18333:8333"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333/"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
  minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: compatibility
      MINIO_ROOT_PASSWORD: compatibility-secret
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
