x-api-common: &api-common
  build:
    context: ..
    dockerfile: backend/Dockerfile
  environment:
    ENV: local
    DB_HOST: db
    DB_NAME: main
    DB_CONNECTOR: mysql+pymysql
    ALLOW_ORIGINS: "http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
    ALLOW_CREDENTIALS: "true"
    ALLOW_METHODS: "*"
    ALLOW_HEADERS: "*"
    LOG_LEVEL: DEBUG
    STORAGE_DRIVER: local:minio
    STORAGE_LOCAL_MINIO_BUCKET_NAME: oqtopus-oqtopus-dev
    STORAGE_LOCAL_MINIO_USERNAME: minioadmin
    STORAGE_LOCAL_MINIO_PASSWORD: minioadmin
    STORAGE_LOCAL_MINIO_ENDPOINT_URL: http://minio:9000
    ALLOW_DELETION: "true"
    EDITABLE_FIELDS: '["name", "organization"]'
    VISIBLE_FIELDS: '["id", "email", "name", "organization", "created_at"]'
    LOGIN_HISTORY_ENABLED: "true"
  depends_on:
    db:
      condition: service_started
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: mysql:8.0
    platform: linux/x86_64
    environment:
      - MYSQL_DATABASE=main
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  mc:
    image: minio/mc
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "
      mc alias set local http://minio:9000 minioadmin minioadmin && \
      mc mb --ignore-existing local/oqtopus-oqtopus-dev && \
      echo '✅ Bucket created (or already exists)'"

  user-api:
    <<: *api-common
    container_name: oqtopus-user-api
    environment:
      ENV: local
      DB_HOST: db
      DB_NAME: main
      DB_CONNECTOR: mysql+pymysql
      ALLOW_ORIGINS: "http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
      ALLOW_CREDENTIALS: "true"
      ALLOW_METHODS: "*"
      ALLOW_HEADERS: "*"
      LOG_LEVEL: DEBUG
      STORAGE_DRIVER: local:minio
      STORAGE_LOCAL_MINIO_BUCKET_NAME: oqtopus-oqtopus-dev
      STORAGE_LOCAL_MINIO_USERNAME: minioadmin
      STORAGE_LOCAL_MINIO_PASSWORD: minioadmin
      STORAGE_LOCAL_MINIO_ENDPOINT_URL: http://minio:9000
      ALLOW_DELETION: "true"
      EDITABLE_FIELDS: '["name", "organization"]'
      VISIBLE_FIELDS: '["id", "email", "name", "organization", "created_at"]'
      LOGIN_HISTORY_ENABLED: "true"
      POWERTOOLS_METRICS_NAMESPACE: user-api
      POWERTOOLS_SERVICE_NAME: user-api
    command: uv run uvicorn oqtopus_cloud.user.lambda_function:app --host 0.0.0.0 --port 8080 --log-level debug
    ports:
      - "8080:8080"

  provider-api:
    <<: *api-common
    container_name: oqtopus-provider-api
    environment:
      ENV: local
      DB_HOST: db
      DB_NAME: main
      DB_CONNECTOR: mysql+pymysql
      ALLOW_ORIGINS: "http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
      ALLOW_CREDENTIALS: "true"
      ALLOW_METHODS: "*"
      ALLOW_HEADERS: "*"
      LOG_LEVEL: DEBUG
      STORAGE_DRIVER: local:minio
      STORAGE_LOCAL_MINIO_BUCKET_NAME: oqtopus-oqtopus-dev
      STORAGE_LOCAL_MINIO_USERNAME: minioadmin
      STORAGE_LOCAL_MINIO_PASSWORD: minioadmin
      STORAGE_LOCAL_MINIO_ENDPOINT_URL: http://minio:9000
      ALLOW_DELETION: "true"
      EDITABLE_FIELDS: '["name", "organization"]'
      VISIBLE_FIELDS: '["id", "email", "name", "organization", "created_at"]'
      LOGIN_HISTORY_ENABLED: "true"
      POWERTOOLS_METRICS_NAMESPACE: provider-api
      POWERTOOLS_SERVICE_NAME: provider-api
    command: uv run uvicorn oqtopus_cloud.provider.lambda_function:app --host 0.0.0.0 --port 8888 --log-level debug
    ports:
      - "8888:8888"

volumes:
  minio-data:
