x-api-env: &api-env
  ENV: local
  DB_HOST: db
  DB_NAME: main
  DB_CONNECTOR: mysql+pymysql
  ALLOW_ORIGINS: "http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
  ALLOW_CREDENTIALS: "true"
  ALLOW_METHODS: "*"
  ALLOW_HEADERS: "*"
  LOG_LEVEL: DEBUG
  STORAGE_DRIVER: local:minio
  STORAGE_LOCAL_MINIO_BUCKET_NAME: oqtopus-oqtopus-dev
  STORAGE_LOCAL_MINIO_USERNAME: minioadmin
  STORAGE_LOCAL_MINIO_PASSWORD: minioadmin
  STORAGE_LOCAL_MINIO_ENDPOINT_URL: http://minio:9000
  ALLOW_DELETION: "true"
  EDITABLE_FIELDS: '["name", "organization"]'
  VISIBLE_FIELDS: '["id", "email", "name", "organization", "created_at"]'
  LOGIN_HISTORY_ENABLED: "true"
  # OTel: defaults to ON locally so changes to tracing.py / instrumentors are
  # exercised by every local request. The bundled otel-collector below is a
  # debug sink (no Tempo/Grafana); for visual trace inspection, run
  # monitoring-prototype in parallel and override OTEL_EXPORTER_OTLP_ENDPOINT.
  # Lambda env is still managed by Terraform — these only affect local compose.
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-0.2}

x-api-common: &api-common
  build:
    context: ..
    dockerfile: backend/Dockerfile
  depends_on:
    db:
      condition: service_started
    minio:
      condition: service_healthy
    otel-collector:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: mysql:8.4
    platform: linux/x86_64
    environment:
      - MYSQL_DATABASE=main
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  mc:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "
      mc alias set local http://minio:9000 minioadmin minioadmin && \
      mc mb --ignore-existing local/oqtopus-oqtopus-dev && \
      echo '✅ Bucket created (or already exists)'"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: oqtopus-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped

  user-api:
    <<: *api-common
    environment:
      <<: *api-env
      POWERTOOLS_METRICS_NAMESPACE: user-api
      POWERTOOLS_SERVICE_NAME: user-api
    command: uv run uvicorn oqtopus_cloud.user.lambda_function:app --host 0.0.0.0 --port 8080 --log-level debug
    ports:
      - "8080:8080"

  provider-api:
    <<: *api-common
    environment:
      <<: *api-env
      POWERTOOLS_METRICS_NAMESPACE: provider-api
      POWERTOOLS_SERVICE_NAME: provider-api
    command: uv run uvicorn oqtopus_cloud.provider.lambda_function:app --host 0.0.0.0 --port 8888 --log-level debug
    ports:
      - "8888:8888"

volumes:
  minio-data:
