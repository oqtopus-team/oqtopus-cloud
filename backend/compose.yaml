x-api-env: &api-env
  ENV: local
  DB_HOST: db
  DB_NAME: main
  DB_CONNECTOR: mysql+pymysql
  ALLOW_ORIGINS: "http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173"
  ALLOW_CREDENTIALS: "true"
  ALLOW_METHODS: "*"
  ALLOW_HEADERS: "*"
  LOG_LEVEL: DEBUG
  # Hardcoded (not ${VAR:-default}) on purpose: `make up` exports its own
  # host-side STORAGE_SEAWEEDFS_* (for seed/init_storage.py, which run
  # outside docker) and, since it shells out to `docker compose up`, those
  # would otherwise silently override these container-side values too.
  STORAGE_DRIVER: seaweedfs
  STORAGE_SEAWEEDFS_BUCKET_NAME: oqtopus-oqtopus-dev
  STORAGE_SEAWEEDFS_USERNAME: devadmin
  STORAGE_SEAWEEDFS_PASSWORD: devadmin123
  STORAGE_SEAWEEDFS_ENDPOINT_URL: http://seaweedfs:8333
  ALLOW_DELETION: "true"
  EDITABLE_FIELDS: '["name", "organization"]'
  VISIBLE_FIELDS: '["id", "email", "name", "organization", "created_at"]'
  LOGIN_HISTORY_ENABLED: "true"
  # OTel: defaults to ON locally so changes to tracing.py / instrumentors are
  # exercised by every local request. The bundled otel-collector below is a
  # debug sink (no Tempo/Grafana); for visual trace inspection, run
  # monitoring-prototype in parallel and override OTEL_EXPORTER_OTLP_ENDPOINT.
  # Lambda env is still managed by Terraform — these only affect local compose.
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-0.2}

x-api-common: &api-common
  build:
    context: ..
    dockerfile: backend/Dockerfile
  depends_on:
    db:
      condition: service_started
    seaweedfs-bucket-init:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: mysql:8.4
    platform: linux/x86_64
    environment:
      - MYSQL_DATABASE=main
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
    ports:
      - 3306:3306

  # Object storage backing the seaweedfs driver (see x-api-env above).
  # `-s3` is required to enable the S3 gateway at all (the image's default
  # command does not start it).
  seaweedfs:
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-dir=/data"]
    environment:
      # SeaweedFS bootstraps an admin S3 identity from these, and it must match
      # STORAGE_SEAWEEDFS_USERNAME/PASSWORD above. Without them the gateway has
      # no identity at all: unsigned requests are allowed, but every *signed*
      # one — including all presigned uploads — is rejected with 403
      # InvalidAccessKeyId.
      AWS_ACCESS_KEY_ID: devadmin
      AWS_SECRET_ACCESS_KEY: devadmin123
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Master UI / cluster status
      - "9001:8888" # Filer UI (remapped; 8888/8889/8890 are provider/admin/user_signup API ports)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # Checks the S3 port specifically (not the master's :9333/cluster/status):
      # seaweedfs-bucket-init below talks to :8333, and that gateway binds about
      # 10s after the master reports healthy. No `-f`: an unsigned GET against
      # the S3 API legitimately returns a non-2xx (e.g. 403), so this only needs
      # *some* HTTP response, not a successful one.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333/"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 15s

  # SeaweedFS doesn't guarantee bucket auto-creation on first write, so bootstrap
  # the bucket explicitly. `s3.bucket.create` is idempotent, so this is safe to
  # re-run on every `make up`.
  seaweedfs-bucket-init:
    image: chrislusf/seaweedfs
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "echo 's3.bucket.create -name oqtopus-oqtopus-dev' | weed shell -master=seaweedfs:9333"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: oqtopus-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped

  user-api:
    <<: *api-common
    environment:
      <<: *api-env
      POWERTOOLS_METRICS_NAMESPACE: user-api
      POWERTOOLS_SERVICE_NAME: user-api
    command: uv run uvicorn oqtopus_cloud.user.lambda_function:app --host 0.0.0.0 --port 8080 --log-level debug
    ports:
      - "8080:8080"

  provider-api:
    <<: *api-common
    environment:
      <<: *api-env
      POWERTOOLS_METRICS_NAMESPACE: provider-api
      POWERTOOLS_SERVICE_NAME: provider-api
    command: uv run uvicorn oqtopus_cloud.provider.lambda_function:app --host 0.0.0.0 --port 8888 --log-level debug
    ports:
      - "8888:8888"

volumes:
  seaweedfs-data:
