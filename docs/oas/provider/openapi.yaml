openapi: 3.0.1
info:
  title: OQTOPUS Cloud Provider API
  version: '1.0'
  contact:
    name: oqtopus-team
    email: oqtopus-team[at]googlegroups.com
  description: OQTOPUS Cloud Provider API. This API is used to interact with the OQTOPUS Cloud service. The API provides endpoints to manage devices, jobs, and results.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8888
    description: Local server url
paths:
  /devices/{device_id}:
    patch:
      tags:
        - devices
      summary: Update data of selected device
      description: Update data of selected device.<br/>Modifiable device propeties are:<br/><br/> - status (all device types)<br/> - number of pending jobs  (all device types)<br/>- calibrationData (QPU devices only)
      operationId: patchDeviceData
      security: []
      parameters:
        - in: path
          name: device_id
          description: Device ID
          required: true
          schema:
            type: string
            example: Kawasaki
      requestBody:
        description: New calibration data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devices.DeviceDataUpdate'
            examples:
              status update (unavailable):
                value:
                  command: DeviceStatusUpdate
                  status: unavailable
                  available_at: '2023-09-10T14:00:00Z'
              status update (available):
                value:
                  command: DeviceStatusUpdate
                  status: available
              pending jobs update:
                value:
                  command: DevicePendingJobsUpdate
                  n_pending_jobs: 6
              calibrationData update:
                value:
                  command: DeviceCalibrationUpdate
                  device_info: '{ ''calibration_data'': { ''qubit_connectivity'': [''(1,4)'', ''(4,5)'', ''(5,8)''], ''t1'': {''0'': 55.51, ''1'': 37.03, ''2'': 57.13}, ''t2'': {''0'': 99.31, ''1'': 111.03, ''2'': 30.12}, ''ro_error'': {''0'': 4.67e-2, ''1'': 1.8e-1, ''2'': 3.55e-1}, ''gate_error'': {''sx'': {''0'': 6.92e-3, ''1'': 2.96e-3, ''2'': 7.2e-2}}, ''meas_prob0_as1'': {''0'': 6.08e-3, ''1'': 1.2e-2, ''2'': 2.48e-1}, ''meas_prob1_as0'': {''0'': 2.81e-2, ''1'': 3.86e-1, ''2'': 8.11e-2}, ''gate_duration'': {''sx'': {''0'': 29.3, ''1'': 50.9, ''2'': 45.4}} }, }'
                  calibrated_at: '2023-09-10T14:00:00Z'
      responses:
        '200':
          description: Device's data updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices.DeviceDataUpdateResponse'
              example:
                message: Device's data updated
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequest'
              example:
                message: Bad request malformed input data
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: Device not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal server error
  /jobs:
    get:
      tags:
        - jobs
      summary: Search jobs for a device
      description: Search jobs for a device
      operationId: getjobs
      security: []
      parameters:
        - in: query
          name: device_id
          required: true
          description: Device identifier
          schema:
            type: string
            example: Kawasaki
        - in: query
          name: fields
          description: |-
            Allows to specify an exact list of job properties to fetch for a single job. Each element of the list must be a valid name of job property.

            If parameter is specified and requested job field is not defined for a job null is returned.

            If parameter is omitted all available job properties are returned. Undefined job properties (null properties) are not included in the response.
          required: false
          schema:
            type: string
            maxLength: 1024
            example: job_id,status,name
        - in: query
          name: status
          description: Additional search parameter:<br/> Search jobs with specified status only
          schema:
            $ref: '#/components/schemas/jobs.JobStatus'
        - in: query
          name: max_results
          description: Additional search parameter:<br/> Set max number of quantum jobs to return in single request
          schema:
            type: integer
            example: 1
        - in: query
          name: timestamp
          description: Additional search parameter:<br/> Jobs created after the specified timetsamp
          schema:
            type: string
            example: '2022-12-15 15:54:46'
      responses:
        '200':
          description: List of jobs for a device
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/jobs.GetJobsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequest'
              example:
                message: Bad request malformed input data
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.InternalServerError'
              example:
                message: Internal server error
  /jobs/{job_id}:
    get:
      summary: Get a job by ID
      description: Get a job by ID
      operationId: getJob
      security: []
      tags:
        - jobs
      parameters:
        - in: path
          name: job_id
          required: true
          description: Job identifier
          schema:
            type: string
      responses:
        '200':
          description: Return quantum job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobs.JobDef'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequest'
              example:
                message: Bad request malformed input data
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: job not found
  /jobs/{job_id}/status:
    patch:
      summary: Modify selected quantum job (update status).
      description: Used by device to set job status to "running".<br/>Other statuses are set by CloudAPI automatically when result is created
      operationId: patchJob
      security: []
      tags:
        - jobs
      parameters:
        - in: path
          name: job_id
          required: true
          description: Job identifier
          schema:
            type: string
      requestBody:
        description: 'New job status. '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.JobStatusUpdate'
      responses:
        '200':
          description: job data updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobs.JobStatusUpdateResponse'
              example:
                message: job data updated
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: Job not found
        '409':
          description: Returned when the specified job is not in a status thatt allows transition to the requested status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.ConflictError'
              example:
                message: The specified job is not in a status thatt allows transition to the requested status.
  /jobs/{job_id}/job_info:
    patch:
      summary: Update selected quantum job's job_info by placing job results
      description: |
        Used by device to set results or error details in job_info、accompanied by appropriate status updating.
        Note that job info descriptor (sampling, estimation, etc) cannot be modified.
      operationId: patchJobInfo
      security: []
      tags:
        - jobs
      parameters:
        - in: path
          name: job_id
          required: true
          description: Job identifier
          schema:
            type: string
      requestBody:
        description: Modifications applied to Job info
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jobs.UpdateJobInfoRequest'
      responses:
        '200':
          description: job info updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobs.UpdateJobInfoResponse'
              example:
                message: Job info updated.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BadRequest'
              example:
                message: Bad request malformed input data
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NotFoundError'
              example:
                message: Job not found
components:
  schemas:
    devices.DeviceStatusUpdate:
      type: object
      properties:
        command:
          type: string
          example: DeviceStatusUpdate
        status:
          type: string
          enum:
            - available
            - unavailable
        available_at:
          description: Parameter mandatory and valid for status `unavailable`
          type: string
          format: date-time
          example: '2023-09-10T14:00:00'
    devices.DevicePendingJobsUpdate:
      type: object
      properties:
        command:
          type: string
          example: DevicePendingJobsUpdate
        n_pending_jobs:
          type: integer
    devices.DeviceCalibrationUpdate:
      type: object
      properties:
        command:
          type: string
          example: DeviceCalibrationUpdate
        device_info:
          description: Calibration_data and n_nodes etc. Make sure that the value is a valid JSON data.
          type: string
          example: |-
            {
              "n_nodes": 512,
              "calibration_data": {
                "qubit_connectivity": [
                  "(1,4)",
                  "(4,5)",
                  "(5,8)"
                ],
                "t1": {
                  "0": 55.51,
                  "1": 37.03,
                  "2": 57.13
                }
              }
            }
        calibrated_at:
          description: Parameter mandatory and valid if calibrationData not null
          type: string
          format: date-time
          example: '2023-09-10T14:00:00'
    devices.DeviceDataUpdate:
      discriminator:
        propertyName: command
        mapping:
          DeviceStatusUpdate: '#/components/schemas/devices.DeviceStatusUpdate'
          DevicePendingJobsUpdate: '#/components/schemas/devices.DevicePendingJobsUpdate'
          DeviceCalibrationUpdate: '#/components/schemas/devices.DeviceCalibrationUpdate'
      oneOf:
        - $ref: '#/components/schemas/devices.DeviceStatusUpdate'
        - $ref: '#/components/schemas/devices.DevicePendingJobsUpdate'
        - $ref: '#/components/schemas/devices.DeviceCalibrationUpdate'
    devices.DeviceDataUpdateResponse:
      type: object
      properties:
        message:
          type: string
          default: Device's data updated
          example: Device's data updated
      required:
        - message
    error.BadRequest:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    error.NotFoundError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    error.InternalServerError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    jobs.JobStatus:
      type: string
      enum:
        - submitted
        - ready
        - running
        - succeeded
        - failed
        - cancelled
      example: submitted
    jobs.JobId:
      type: string
      format: string
      example: 7af020f6-2e38-4d70-8cf0-4349650ea08c
    jobs.OperatorItem:
      type: object
      properties:
        pauli:
          type: string
          description: The Pauli string.
          example: X 0 X 1
        coeff:
          description: Complex coefficient number in the Pauli string representation.
          type: array
          items:
            type: number
          minItems: 1
          maxItems: 2
      required:
        - pauli
    jobs.EstimationResult:
      type: object
      description: |
        *(Only for estimation jobs)* The estimated expectation value and the standard deviation
        of the operators specified in `job_info.operator` field which is intended to be provided for estimation jobs.
      properties:
        exp_value:
          description: |
            This field must contain an array of numbers with a maximum length of 2, representing a complex number.
            The first element corresponds to the real part, and the second corresponds to the imaginary part.
          type: array
          items:
            type: number
          minItems: 1
          maxItems: 2
        stds:
          description: (Only for estimation jobs) The standard deviation value
          type: number
    jobs.JobResult:
      type: object
      properties:
        counts:
          description: '*(Only for sampling jobs)* JSON string representing the sampling result'
          type: string
          example: |-
            {
              "10": 84,
              "11": 387,
              "10": 454,
              "01": 75
            }
        estimation:
          $ref: '#/components/schemas/jobs.EstimationResult'
        divided_result:
          type: object
          description: Assumed to be used for multiprogramming, but currently not supported yet.
          properties: {}
        properties:
          type: string
        transpile_result:
          type: object
          properties:
            virtual_physical_mapping:
              type: string
      required: []
    jobs.JobInfo:
      type: object
      properties:
        program:
          type: array
          description: A list of OPENQASM3 program. For non-multiprogramming jobs, this field is assumed to contain exactly one program. Otherwise, those programs are combined according to the multiprogramming machinery.
          items:
            type: string
          example: '[ "OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;" ]'
        combined_program:
          type: string
          description: For multiprogramming jobs, this field contains the combined circuit.
        operator:
          description: |
            *(Only for estimation jobs)* The operator (or observable) for which the expectation
            value is to be estimated.
          type: array
          items:
            $ref: '#/components/schemas/jobs.OperatorItem'
        transpiled_program:
          type: string
          example: OPENQASM 3; include "stdgates.inc"; qubit[2] _all_qubits; let q = _all_qubits[0:1]; h q[0]; cx q[0], q[1];
        result:
          $ref: '#/components/schemas/jobs.JobResult'
        message:
          type: string
          description: Describing the reason why there is no result
      required:
        - program
    jobs.GetJobsResponse:
      type: object
      properties:
        job_id:
          $ref: '#/components/schemas/jobs.JobId'
        name:
          type: string
          example: Bell State Sampling
        description:
          type: string
          example: Bell State Sampling Example
        device_id:
          type: string
          example: Kawasaki
        shots:
          type: integer
          minimum: 1
          maximum: 10000000
          example: '1000'
        job_info:
          $ref: '#/components/schemas/jobs.JobInfo'
        transpiler_info:
          type: string
          example: |-
            {
              "qubit_allocation": {
                "0"": 12,
                "1": 16
              },
              "skip_transpilation": false,
              "seed_transpilation": 873
            }
        simulator_info:
          type: string
          example: |-
            {
              "n_qubits": 5,
              "n_nodes": 12,
              "n_per_node": 2,
              "seed_simulation": 39058567,
              "simulation_opt": {
                "optimization_method": "light",
                "optimization_block_size": 1,
                "optimization_swap_level": 1
              }
            }
        mitigation_info:
          type: string
          example: |
            { "ro_error_mitigation": "pseudo_inverse" }
        status:
          $ref: '#/components/schemas/jobs.JobStatus'
        created_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34+09:00'
        updated_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34+09:00'
      required: []
      example:
        job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
        name: Bell State Sampling
        description: Bell State Sampling Example
        device_id: Kawasaki
        job_info:
          program:
            - OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;
          combined_program: null
          transpiled_prgoram: null
          result: {}
          reason: null
        transpiler_info: |-
          {
            "qubit_allocation": {
              "0": 12,
              "1": 16
            },
            "skip_transpilation": false,
            "seed_transpilation": 873
          }
        simulator_info: |-
          {
            "n_qubits": 5,
            "n_nodes": 12,
            "n_per_node": 2,
            "seed_simulation": 39058567,
            "simulation_opt": {
              "optimization_method": "light",
              "optimization_block_size": 1,
              "optimization_swap_level": 1
            }
          }
        mitigation_info: |
          { "ro_error_mitigation": "pseudo_inverse" }
        job_type: sampling
        shots: 1000
        status: submitted
        created_at: '2022-10-19T11:45:34+09:00'
        updated_at: '2022-10-19T11:45:34+09:00'
    jobs.JobType:
      type: string
      enum:
        - sampling
        - estimation
    jobs.JobDef:
      type: object
      properties:
        job_id:
          $ref: '#/components/schemas/jobs.JobId'
        name:
          type: string
          example: Bell State Sampling
        description:
          type: string
          example: Bell State Sampling Example
        device_id:
          type: string
          example: Kawasaki
        shots:
          type: integer
          minimum: 1
          maximum: 10000000
          example: '1000'
        job_type:
          $ref: '#/components/schemas/jobs.JobType'
        job_info:
          $ref: '#/components/schemas/jobs.JobInfo'
        transpiler_info:
          type: string
          example: |-
            {
              "qubit_allocation": {
                "0"": 12,
                "1": 16
              },
              "skip_transpilation": false,
              "seed_transpilation": 873
            }
        simulator_info:
          type: string
          example: |-
            {
              "n_qubits": 5,
              "n_nodes": 12,
              "n_per_node": 2,
              "seed_simulation": 39058567,
              "simulation_opt": {
                "optimization_method": "light",
                "optimization_block_size": 1,
                "optimization_swap_level": 1
              }
            }
        mitigation_info:
          type: string
          example: |
            { "ro_error_mitigation": "pseudo_inverse" }
        status:
          $ref: '#/components/schemas/jobs.JobStatus'
        created_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34+09:00'
        updated_at:
          type: string
          format: date-time
          example: '2022-10-19T11:45:34+09:00'
      required:
        - job_id
        - device_id
        - job_type
        - job_info
        - shots
        - status
        - created_at
      example:
        job_id: 7af020f6-2e38-4d70-8cf0-4349650ea08c
        name: Bell State Sampling
        description: Bell State Sampling Example
        device_id: Kawasaki
        job_type: sampling
        job_info:
          program:
            - OPENQASM 3; qubit[2] q; bit[2] c; h q[0]; cnot q[0], q[1]; c = measure q;
          transpiled_program: null
          result: null
          reason: null
        transpiler_info: |-
          {
            "qubit_allocation": {
              "0": 12,
              "1": 16
            },
            "skip_transpilation": false,
            "seed_transpilation": 873
          }
        simulator_info: |-
          {
            "n_qubits": 5,
            "n_nodes": 12,
            "n_per_node": 2,
            "seed_simulation": 39058567,
            "simulation_opt": {
              "optimization_method": "light",
              "optimization_block_size": 1,
              "optimization_swap_level": 1
            }
          }
        mitigation_info: |
          { "ro_error_mitigation": "pseudo_inverse" }
        shots: 1000
        status: submitted
        created_at: '2022-10-19T11:45:34+09:00'
        updated_at: '2022-10-19T11:45:34+09:00'
    jobs.JobStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
            - running
          example: running
      required:
        - status
    jobs.JobStatusUpdateResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    error.ConflictError:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    jobs.UpdateJobInfo:
      type: object
      properties:
        transpiled_program:
          type: string
        result:
          $ref: '#/components/schemas/jobs.JobResult'
        message:
          type: string
    jobs.UpdateJobInfoRequest:
      type: object
      properties:
        overwrite_status:
          description: Overwrite the job status. If this field is not specified, the status will be updated automatically.
          $ref: '#/components/schemas/jobs.JobStatus'
        execution_time:
          type: number
          description: Execution time for quantum computation. Specify the time in seconds, including up to milliseconds.
        job_info:
          $ref: '#/components/schemas/jobs.UpdateJobInfo'
    jobs.UpdateJobInfoResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
