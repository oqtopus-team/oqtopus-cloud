# Same-origin endpoints for presigned S3 forms and object downloads. SeaweedFS
# authenticates each request. Preserve the original host, path and query.
location ~ ^/oqtopus-oqtopus/?$ {
    if ($request_method != POST) { return 405; }
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log signed_storage;
    error_log  /var/log/nginx/error.log crit;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://seaweedfs:8333;
}

# The APIs store job archives under a job UUID and device metadata under devices/.
location ~ "^/oqtopus-oqtopus/([0-9a-f-]{36}/[A-Za-z0-9_.-]+\.zip|devices/[^/]+/device_info\.zip)$" {
    limit_except GET { deny all; }
    access_log /var/log/nginx/access.log signed_storage;
    error_log  /var/log/nginx/error.log crit;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://seaweedfs:8333;
}
