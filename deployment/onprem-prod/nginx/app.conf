# User-facing BFF front door (HTTPS). Terminates TLS with the internal-CA `app`
# certificate and fronts the SPA, oauth2-proxy and the User API.
#
#   /          -> SPA static files (history fallback)
#   /oauth2/*  -> oauth2-proxy (login / callback / userinfo / sign_out)
#   /api/*     -> user-api, gated by an auth_request to oauth2-proxy; the OAuth2
#                 access token is injected as the Bearer and the /api prefix
#                 stripped.
#
# NOTE: the logout hostnames below assume the default base domain
# (oqtopus.internal) and the default published ports. If you change
# OQTOPUS_BASE_DOMAIN / *_HTTPS_PORT, update the two `set` directives.

js_import logout from /etc/nginx/njs/logout.js;

server {
    listen 443 ssl;
    http2 on;
    server_name app.oqtopus.internal;

    ssl_certificate     /certs/app.crt;
    ssl_certificate_key /certs/app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (browser-facing origin).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # RP-initiated logout targets (read by njs/logout.js).
    set $keycloak_logout_url "https://auth.oqtopus.internal:9443/realms/oqtopus/protocol/openid-connect/logout";
    set $post_logout_uri     "https://app.oqtopus.internal:8443/oauth2/sign_out?rd=/";

    absolute_redirect off;
    large_client_header_buffers 8 32k;
    client_header_buffer_size 8k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    root /usr/share/nginx/html;
    index index.html;

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }

    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header Host          $host;
        proxy_set_header X-Real-IP     $remote_addr;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://user-api:8080;
    }

    location = /logout {
        auth_request /oauth2/auth;
        auth_request_set $logout_bearer $upstream_http_authorization;
        error_page 401 = @proxy_signin;
        js_content logout.redirect;
    }

    location @proxy_signin {
        return 302 /oauth2/start?rd=$request_uri;
    }

    include /etc/nginx/oqtopus-storage.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
