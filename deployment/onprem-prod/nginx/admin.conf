# Admin-facing BFF front door (HTTPS). Same pattern as app.conf but for the
# Admin SPA and the Admin API, behind oauth2-proxy-admin.
#
# NOTE: logout hostnames assume the default base domain / ports; update the two
# `set` directives if OQTOPUS_BASE_DOMAIN / *_HTTPS_PORT change.

js_import logout from /etc/nginx/njs/logout.js;

server {
    listen 443 ssl;
    http2 on;
    server_name admin.oqtopus.internal;

    ssl_certificate     /certs/admin.crt;
    ssl_certificate_key /certs/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $keycloak_logout_url "https://auth.oqtopus.internal:9443/realms/oqtopus/protocol/openid-connect/logout";
    set $post_logout_uri     "https://admin.oqtopus.internal:8444/oauth2/sign_out?rd=/";

    absolute_redirect off;
    large_client_header_buffers 8 32k;
    client_header_buffer_size 8k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    root /usr/share/nginx/html;
    index index.html;

    location /oauth2/ {
        proxy_pass http://oauth2-proxy-admin:4181;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy-admin:4181;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
    }

    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header Host          $host;
        proxy_set_header X-Real-IP     $remote_addr;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://admin-api:8889;
    }

    location = /logout {
        auth_request /oauth2/auth;
        auth_request_set $logout_bearer $upstream_http_authorization;
        error_page 401 = @proxy_signin;
        js_content logout.redirect;
    }

    location @proxy_signin {
        return 302 /oauth2/start?rd=$request_uri;
    }

    include /etc/nginx/oqtopus-storage.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
