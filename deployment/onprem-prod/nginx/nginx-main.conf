# Main nginx config for the on-prem BFF front doors. Loads the njs module used
# by /logout to build an RP-initiated logout URL with id_token_hint captured
# server-side. Per-server TLS + routing live in conf.d/*.conf.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # S3 signatures are credentials. Log only the method and status here.
    log_format signed_storage 'signed-storage $request_method $status';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
