name: Deploy all
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/oqtopus_cloud/**'
      - 'backend/oas/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy-target: [user, provider, admin, lambda_auth, user_signup]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'ap-northeast-1'
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/oqtopus-oqtopus-dev-deploy-lambda

      - name: Set AWS Profile
        run: |
          ACCOUNT_NAME=$(aws iam list-account-aliases --query "AccountAliases[0]" --output text)
          echo "PROFILE=$ACCOUNT_NAME" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Aqua
        run: |
          sudo apt install make
          make setup-aqua
          echo "$HOME/.local/share/aquaproj-aqua/bin" >> "$GITHUB_PATH"

      - name: setup uv
        run: |
          make setup-uv

      - name: Deploy
        working-directory: ./deployment/oqtopus-dev
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sudo -E env PATH="$PATH" make deploy-${{ matrix.deploy-target }}-via-actions

      - name: Publish user OpenAPI spec to S3
        if: matrix.deploy-target == 'user'
        working-directory: ./deployment/oqtopus-dev
        env:
          PUBLISH_OPENAPI_S3_BUCKET: ${{ vars.PUBLISH_OPENAPI_S3_BUCKET }}
          USER_API_SERVER_URL: ${{ vars.USER_API_SERVER_URL }}
          USER_API_SERVER_DESCRIPTION: ${{ vars.USER_API_SERVER_DESCRIPTION }}
        run: |
          sudo -E env PATH="$PATH" make publish-${{ matrix.deploy-target }}-schema-via-actions

      - name: On Success
        if: ${{ success() }}
        run: |
          echo "SUCCESS=1" >> "$GITHUB_ENV"

      - name: On Failure
        if: ${{ failure() }}
        run: |
          echo "SUCCESS=0" >> "$GITHUB_ENV"

      - name: On Exit
        if: ${{ always() }}
        run: |
          source .venv/bin/activate
          python3 ./scripts/build_slack_notification.py \
            --success="$SUCCESS" \
            --timestamp="$(date "+%Y-%m-%d %H:%M:%S")" \
            --run-url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --deploy-target="${{ matrix.deploy-target }}"
        env:
          SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
          SLACK_CHANNEL_NAME: ${{ secrets.SLACK_CHANNEL_NAME }}
