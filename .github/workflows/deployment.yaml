name: deployment
on:
  push:
    branches:
    - develop

jobs:
  deployment:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # AWSの認証をセットアップ
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'ap-northeast-1'
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/oqtopus-oqtopus-dev-deployment-lambda

      # makeをインストール
      - name: Install make
        run: sudo apt install make

      # デプロイ
      - name: Deploy
        uses: actions/checkout@v4
        working-directory: ./deployment
        run: make deploy-all