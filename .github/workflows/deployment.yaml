name: Deploy all
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/oqtopus_cloud/**'

jobs:
  deployment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deploy-target: [user, provider, admin, lambda_auth, user_signup]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'ap-northeast-1'
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/oqtopus-oqtopus-dev-deploy-lambda

      - name: Set AWS Profile
        run: |
          ACCOUNT_NAME=$(aws iam list-account-aliases --query "AccountAliases[0]" --output text)
          echo "PROFILE=$ACCOUNT_NAME" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Poetry
        run: |
          pip install poetry poetry-plugin-export
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install poetry dependencies
        run: poetry install

      - name: Install make
        run: sudo apt install make

      - name: Deploy
        working-directory: ./deployment/oqtopus-dev
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          sudo -E env PATH="$PATH" make deploy-${{ matrix.deploy-target }}-via-actions 2> ../../error.log


      - name: On Exit
        if: ${{ always() }}
        run:
          python3 ./scripts/build_slack_notification.py \
            --success=${{ success() }} \
            --timestamp=$(date "+%Y-%m-%d %H:%M:%S") \
            --run-url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --deploy-target=${{ matrix.deploy-target }}

