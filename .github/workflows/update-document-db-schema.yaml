name: Update document DB schema

on:
  push:
    branches:
      - develop
    paths:
    - 'backend/oas/*/schemas/*'
    - 'backend/oqtopus_cloud/*/schemas/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-document:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install make
      run: sudo apt install make

    - name: Set up Aqua
      run: |
        make setup-aqua
        make doctor

    - name: Docker Compose Up
      run: |
        cd backend
        make build-minio
        docker compose up -d

    - name: Update document DB schema
      run: |
        TIMEOUT=60
        until docker exec backend-db-1 \
          mysql -h127.0.0.1 -uroot -proot -e "SELECT 1;" >/dev/null 2>&1; do
          echo "Waiting for MySQL to become ready..."
          sleep 2
          TIMEOUT=$((TIMEOUT - 2))
          if [ $TIMEOUT -le 0 ]; then
            echo "MySQL did not become ready in time."
            exit 1
          fi
        done
        make tbls-docs

    - name: Auto PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TRIGGERED_PUSH_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        if git diff --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -am "Auto update DB schema docs $(date +%Y%m%d-%H%M%S)"
        git push origin "$BRANCH_NAME"
