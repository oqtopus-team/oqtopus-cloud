name: Deploy qiqb-dev
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the terraform plans (false = plan only)"
        type: boolean
        default: true

concurrency:
  group: qiqb-dev-deploy

permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: ap-northeast-1
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail, so a failed `terraform plan | tee` stops the step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'ap-northeast-1'
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_QIQB_DEV }}:role/oqtopus-qiqb-dev-deploy-terraform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Aqua
        run: |
          sudo apt install -y make
          make setup-aqua
          echo "$HOME/.local/share/aquaproj-aqua/bin" >> "$GITHUB_PATH"

      - name: setup uv
        run: |
          make setup-uv

      # tfvars/tfbackend are gitignored; the environment values live in
      # Secrets Manager (qiqb-dev account) and are materialized per run.
      - name: Fetch terraform config
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id oqtopus-cloud/qiqb-dev/terraform-files \
            --query SecretString --output text)
          echo "$SECRET" | jq -r .infrastructure_tfvars    > terraform/infrastructure/oqtopus-dev/qiqb-dev.tfvars
          echo "$SECRET" | jq -r .infrastructure_tfbackend > terraform/infrastructure/oqtopus-dev/qiqb-dev.tfbackend
          echo "$SECRET" | jq -r .service_tfvars           > terraform/service/oqtopus-dev/qiqb-dev.tfvars
          echo "$SECRET" | jq -r .service_tfbackend        > terraform/service/oqtopus-dev/qiqb-dev.tfbackend

      - name: Build Lambda packages
        working-directory: ./deployment/qiqb-dev
        run: |
          make PROFILE=qiqb-dev zip-user zip-provider zip-admin zip-lambda_auth zip-user_signup zip-pending-jobs-updater-worker zip-lambda-version-cleaner

      # terraform service reads bin/<id>/lambda.zip; lambda_auth lives under the module
      - name: Place packages for terraform
        run: |
          mkdir -p terraform/service/oqtopus-dev/bin terraform/service/modules/lambda-auth/bin
          cp -r deployment/qiqb-dev/bin/user deployment/qiqb-dev/bin/provider deployment/qiqb-dev/bin/admin deployment/qiqb-dev/bin/user_signup deployment/qiqb-dev/bin/pending-jobs-updater deployment/qiqb-dev/bin/lambda-version-cleaner terraform/service/oqtopus-dev/bin/
          cp -r deployment/qiqb-dev/bin/lambda_auth terraform/service/modules/lambda-auth/bin/

      # service references the infrastructure state, so infrastructure goes first
      - name: Terraform infrastructure
        working-directory: ./terraform/infrastructure/oqtopus-dev
        run: |
          terraform init -backend-config=qiqb-dev.tfbackend -reconfigure -input=false
          terraform plan -var-file=qiqb-dev.tfvars -out=qiqb-dev.tfplan -input=false -no-color | tee plan.txt
          { echo "## infrastructure"; grep -E "will be|must be|^Plan:|No changes" plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.apply }}" = "true" ]; then
            terraform apply -input=false qiqb-dev.tfplan
          fi

      - name: Terraform service
        working-directory: ./terraform/service/oqtopus-dev
        run: |
          terraform init -backend-config=qiqb-dev.tfbackend -reconfigure -input=false
          terraform plan -var-file=qiqb-dev.tfvars -out=qiqb-dev.tfplan -input=false -no-color | tee plan.txt
          { echo "## service"; grep -E "will be|must be|^Plan:|No changes" plan.txt || true; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.apply }}" = "true" ]; then
            terraform apply -input=false qiqb-dev.tfplan
          fi
