name: Update document

on:
  push:
    branches:
      - develop
    paths:
    - 'backend/oas/provider/**'
    - 'backend/oas/user/**'
    - 'terraform/infrastructure/**'
    - 'terraform/server/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  update-document:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install make
      run: sudo apt install make

    - name: Update document
      run: make docs

    - name: Create new branch and switch
      run: |
        BRANCH_NAME="chore/auto-update-docs-$(date +%Y%m%d-%H%M%S)"
        git checkout -b $BRANCH_NAME
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Commit changes
      run: |
        git commit -m "Auto update document $(date +%Y%m%d-%H%M%S)" -a
        git push origin ${{ env.BRANCH_NAME }}

    - name: Create Pull Request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TRIGGERED_PUSH_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        gh pr create --title "chore: [CI] Auto update document $(date +%Y%m%d-%H%M%S)" \
                      --body "This PR was automatically generated.\n${{ env.TRIGGERED_PUSH_URL }}" \
                      --base develop \
                      --head ${{ env.BRANCH_NAME }}