name: OpenAPI check

on:
  pull_request:
    branches:
      - 'test/#335-auto-detect-oas-breaking-changes'
    paths:
      - '.github/workflows/**'
      - 'backend/oas/admin/**'
      - 'backend/oas/provider/**'
      - 'backend/oas/user/**'
      - 'backend/oas/user_signup/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-openapi-breaking-changes:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api: [admin, provider, user, user_signup]

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Fetch base OpenAPI spec
        id: fetch-base
        run: |
          # Make sure we have the latest base ref
          git fetch --depth=1 origin ${{ github.base_ref }}

          # Extract the OpenAPI spec from base into a temp file
          git show origin/${{ github.base_ref }}:backend/oas/${{ matrix.api }}/openapi.yaml > openapi_base.yaml

      - name: Run oasdiff
        id: oasdiff
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: openapi_base.yaml
          revision: backend/oas/${{ matrix.api }}/openapi.yaml

      - name: Post PR comment if breaking changes detected
        if: steps.oasdiff.outputs.breaking != 'No breaking changes'
        uses: actions/github-script@v7
        env:
          API_NAME: ${{ matrix.api }}
          REPORT: ${{ steps.oasdiff.outputs.breaking }}
        with:
          script: |
            const report = process.env.REPORT;
            const apiName = process.env.API_NAME;

            // Generate link to the specific workflow run logs
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `### 🚨 Potential Breaking Changes Detected: ${apiName} API

            \`\`\`text
            ${report}
            \`\`\`

            [🔍 View Detailed GitHub Action Log](${runUrl})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
