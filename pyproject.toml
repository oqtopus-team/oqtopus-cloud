[project]
name = "backend"
version = "1.2.0"
description = "OQTOPUS Cloud is a project that provides the architecture of cloud quantum computers as an open-source software (OSS). By using it in conjunction with various OSS provided by [@oqtopus-team](https://github.com/oqtopus-team), you can build a cloud quantum computer system."
authors = [
    {name = "oqtopus-team", email = "oqtopus-team@googlegroups.com"}
]
readme = "README.md"
requires-python = ">=3.12.3,<4.0.0"
dependencies = [
  "mangum>=0.17.0",
  "pymysql>=1.1.0",
  "aws-lambda-powertools>=2.41.0",
  "sqlalchemy>=2.0.28",
  "databases>=0.9.0",
  "uvicorn>=0.29.0",
  "cryptography>=42.0.5",
  "pydantic[email]>=2.1",
  "fastapi>=0.110.0",
  "aws-xray-sdk>=2.13.0",
  "setuptools>=75.1.0",
  "types-setuptools>=75.1.0.20240917",
  "uuid7>=0.1.0",
  "uuid-v7>=1.0.0",
  "pytest-env>=1.1.5",
  "fastapi-pagination>=0.12.32",
  "pyjwt>=2.10.1",
  "pytz>=2025.1",
  "types-pytz>=2025.1.0.20250204",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.20",
  "fsspec>=2025.5.1",
  "s3fs>=2025.5.1",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/oqtopus_cloud"]

[tool.pytest_env]
DB_NAME="main"
DB_USER="admin"
DB_PASS="password"
DB_HOST="localhost"
ENV="local"
POWERTOOLS_METRICS_NAMESPACE="user-api"
POWERTOOLS_SERVICE_NAME="user-api"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-vv --cov=backend/api --cov-report=xml --cov-report=html"
filterwarnings = [
  "ignore:The \\'app\\' shortcut is now deprecated. Use the explicit style \\'transport=WSGITransport\\(app=\\.\\.\\.\\)\\' instead\\.",
]

[tool.ruff]
line-length = 88
lint.unfixable = ["F401"]

[tool.mypy]
disallow-untyped-defs = true
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true

[dependency-groups]
dev = [
  "boto3>=1.34.55",
  "ruff>=0.3.4",
  "datamodel-code-generator>=0.26.2",
  "requests>=2.31.0",
  "pytest>=8.1.1",
  "pytest-cov>=5.0.0",
  "mypy>=1.9.0",
  "case-converter>=1.1.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "boto3-stubs>=1.34.74",
  "shandy-sqlfmt>=0.21.2",
  "pytest-sqlalchemy-mock>=0.1.5",
  "coverage>=7.6.9",
  "alembic>=1.13.2",
  "mysql>=0.0.3",
  "moto>=5.1.0",
  "slack_sdk>=3.35.0",
]
docs = [
  "mkdocs-material>=9.5.15",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-glightbox>=0.3.7",
  "mkdocs-swagger-ui-tag>=0.6.9",
  "mkdocs-static-i18n>=1.3.0",
  "pymdown-extensions>=10.7.1",
  "mkdocs-exclude>=1.0.2",
]

[tool.uv.sources]
qubex = { git = "https://github.com/amachino/qubex.git", rev = "v1.2.12" }
